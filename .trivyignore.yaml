vulnerabilities:
  # golang.org/x/text, which every Go binary below vendors
  - id: CVE-2026-56852
    paths:
      - "usr/local/bin/gopls"
      - "usr/local/bin/terraform"
      - "usr/local/bin/tofu"
    expired_at: 2026-10-31
    statement: |
      gopls 0.23.0, the latest release, depends on golang.org/x/text v0.38.0,
      and Terraform 1.15.8 and OpenTofu 1.12.5 on v0.37.0. The fix is in
      v0.39.0, so this clears once each upstream releases a build that picks
      it up. OpenTofu's development branch already uses v0.40.0, so the fix is
      expected in the next OpenTofu release.

  # terraform
  - id: CVE-2026-27145
    paths:
      - "usr/local/bin/terraform"
      - "usr/local/bin/tofu-ls"
    expired_at: 2026-10-31
    statement: |
      Terraform 1.15.7 was built with Go 1.25.10, which is affected by this CVE.
      The upstream development branch already uses Go 1.26.4, so the fix is
      expected in the next Terraform release.
      OpenTofu Language Server 0.5.3 was built with Go 1.26.0, and the fix is
      in Go 1.26.4. The upstream development branch still declares go 1.26.0,
      so no fixed release is available yet.
