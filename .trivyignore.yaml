vulnerabilities:
  - id: CVE-2026-56852
    paths:
      - "usr/local/bin/gopls"
      - "usr/local/bin/tofu"
    expired_at: 2026-10-31
    statement: |
      gopls 0.23.0, the latest release, depends on golang.org/x/text v0.38.0
      and OpenTofu 1.12.6 on v0.37.0. The fix is in v0.39.0. The gopls
      development branch carries v0.42.0, and OpenTofu v0.41.0 on both the
      v1.12 branch the next patch release comes from and the v1.13 branch
      1.13.0-beta1 was cut from, so the fix is expected in the next release of
      each.

  - id: CVE-2026-56864
    paths:
      - "usr/local/bin/gopls"
      - "usr/local/bin/terraform-ls"
      - "usr/local/bin/tofu"
    expired_at: 2026-10-31
    statement: |
      The vulnerable symbol is sumdb.Client.Lookup, reached only when a program
      verifies modules against a GOSUMDB, and none of the three binaries links
      that package.
      gopls 0.23.0, the latest release, depends on golang.org/x/mod v0.37.0,
      Terraform Language Server 0.39.0 on v0.38.0 and OpenTofu 1.12.6 on
      v0.35.0. The fix is in v0.40.0. The gopls development branch carries
      v0.41.0, so the fix is expected in the next gopls release. The Terraform
      Language Server development branch carries v0.39.0, and OpenTofu v0.38.0
      on the v1.12 branch the next patch release comes from and v0.39.0 on the
      v1.13 branch 1.13.0-beta1 was cut from, so neither of those two has a
      fixed release yet.
  - id: CVE-2026-56865
    paths:
      - "usr/local/bin/gopls"
      - "usr/local/bin/terraform-ls"
      - "usr/local/bin/tofu"
    expired_at: 2026-10-31
    statement: |
      The vulnerable symbol is tlog.tileHashReader.ReadHashes, reached only
      when a program fetches checksum database tiles through a GOPROXY, and
      none of the three binaries links that package.
      gopls 0.23.0, the latest release, depends on golang.org/x/mod v0.37.0,
      Terraform Language Server 0.39.0 on v0.38.0 and OpenTofu 1.12.6 on
      v0.35.0. The fix is in v0.40.0. The gopls development branch carries
      v0.41.0, so the fix is expected in the next gopls release. The Terraform
      Language Server development branch carries v0.39.0, and OpenTofu v0.38.0
      on the v1.12 branch the next patch release comes from and v0.39.0 on the
      v1.13 branch 1.13.0-beta1 was cut from, so neither of those two has a
      fixed release yet.

  - id: CVE-2026-46600
    paths:
      - "usr/local/bin/terraform"
      - "usr/local/bin/tofu"
      - "usr/local/bin/tofu-ls"
    expired_at: 2026-10-31
    statement: |
      OpenTofu 1.12.6 depends on golang.org/x/net v0.54.0, and the fix is in
      v0.56.0. The v1.12 branch the next patch release comes from carries
      v0.57.0, so the fix is expected in the next OpenTofu release.
      Terraform 1.16.2 and OpenTofu Language Server 0.5.3 reach the same
      package through the Go standard library they were built with, Go 1.26.4
      and Go 1.26.0, where the fix is in Go 1.26.6. Terraform pins Go 1.26.4 on
      the v1.16 branch the next patch release comes from and the OpenTofu
      language server still declares go 1.26.0, so neither has a fixed release
      yet.

  - id: CVE-2026-39821
    paths:
      - "usr/local/bin/terraform"
      - "usr/local/bin/terraform-ls"
      - "usr/local/bin/tofu"
      - "usr/local/bin/tofu-ls"
    expired_at: 2026-10-31
    statement: |
      OpenTofu 1.12.6 depends on golang.org/x/net v0.54.0, and the fix is in
      v0.55.0. The v1.12 branch the next patch release comes from carries
      v0.57.0, so the fix is expected in the next OpenTofu release.
      Terraform 1.16.2, Terraform Language Server 0.39.0 and OpenTofu Language
      Server 0.5.3 reach the same package through the Go standard library they
      were built with, Go 1.26.4, Go 1.25.12 and Go 1.26.0, where the fix is in
      Go 1.25.13 and Go 1.26.6. Terraform pins Go 1.26.4 on the v1.16 branch
      the next patch release comes from and the OpenTofu language server still
      declares go 1.26.0, so neither has a fixed release yet. Terraform
      Language Server tracks the Go 1.25 line, so it picks the fix up on its
      next release.

