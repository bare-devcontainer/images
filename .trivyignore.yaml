      OpenTofu Language Server 0.5.3 was built with Go 1.26.0; the fix is in Go 1.26.4.
  - id: CVE-2026-39822
    paths:
      - "usr/local/bin/terraform"
      - "usr/local/bin/terraform-ls"
      - "usr/local/bin/tofu-ls"
    expired_at: 2026-10-31
    statement: |
      Terraform 1.15.7 was built with Go 1.25.10, which is affected by this CVE.
      The upstream development branch was upgraded to Go 1.26.4, but it is till affected.
      Terraform Language Server 0.38.8 was built with Go 1.25.11, which is affected by this CVE.
      The upstream development branch has not yet been updated to a Go version that is not affected by this CVE.
      OpenTofu Language Server 0.5.3 was built with Go 1.26.0; the fix is in Go 1.26.5.
  - id: GHSA-hrxh-6v49-42gf
    paths:
      - "usr/local/bin/terraform"
      - "usr/local/bin/tofu"
    expired_at: 2026-10-31
    statement: |
      Terraform repository currently uses google.golang.org/grp v1.80.0, so no fix is available yet.
      OpenTofu 1.12.5 uses google.golang.org/grpc v1.79.3, and the fix is in v1.82.1.
      The upstream development branch already uses v1.83.0, so the fix is
      expected in the next OpenTofu release.

  # opentofu: dependencies vendored into the tofu binary. Every one of these is
  # already bumped past its fixed version on the upstream development branch.
  - id: CVE-2026-39883
    paths:
      - "usr/local/bin/tofu"
    expired_at: 2026-10-31
    statement: |
      OpenTofu 1.12.5 depends on go.opentelemetry.io/otel/sdk v1.42.0, and the
      fix is in v1.43.0. The upstream development branch already uses v1.44.0,
      so the fix is expected in the next OpenTofu release. The advisory
      describes PATH hijacking on BSD and Solaris, which these Linux images do
      not run on.
  - id: CVE-2026-25681
    paths:
      - "usr/local/bin/tofu"
    expired_at: 2026-10-31
    statement: |
      OpenTofu 1.12.5 depends on golang.org/x/net v0.54.0, and the fix is in
      v0.55.0. The upstream development branch already uses v0.57.0, so the fix
      is expected in the next OpenTofu release. The advisory covers the html
      parser, which the CLI does not expose to untrusted input.
  - id: CVE-2026-27136
