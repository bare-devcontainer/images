vulnerabilities:
  - id: CVE-2026-56864
    paths:
      - "usr/local/bin/tofu"
    expired_at: 2027-01-31
    statement: |
      OpenTofu 1.13.2, the latest release, depends on golang.org/x/mod v0.39.0,
      and the fix is in v0.40.0. OpenTofu carries v0.39.0 on the v1.13 branch
      the next patch release comes from, so no fixed patch release is available
      yet. The development branch 1.14.0 comes from carries v0.41.0, so the fix
      is expected in OpenTofu 1.14.0.
