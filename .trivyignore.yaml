vulnerabilities:
  - id: CVE-2026-56852
    paths:
      - "usr/local/bin/gopls"
      - "usr/local/bin/terraform"
      - "usr/local/bin/tofu"
    expired_at: 2026-10-31
    statement: |
      gopls 0.23.0, the latest release, depends on golang.org/x/text v0.38.0,
      and Terraform 1.15.8 and OpenTofu 1.12.5 on v0.37.0. The fix is in
      v0.39.0, so this clears once each upstream releases a build that picks
      it up. OpenTofu's development branch already uses v0.40.0, so the fix is
      expected in the next OpenTofu release.

  - id: CVE-2026-56864
    paths:
      - "usr/local/bin/gopls"
      - "usr/local/bin/terraform"
      - "usr/local/bin/terraform-ls"
      - "usr/local/bin/tofu"
    expired_at: 2026-10-31
    statement: |
      The vulnerable symbol is sumdb.Client.Lookup, reached only when a program
      verifies modules against a GOSUMDB, and none of the four binaries links
      that package.
      gopls 0.23.0, the latest release, depends on golang.org/x/mod v0.37.0,
      Terraform Language Server 0.39.0 on v0.38.0, and Terraform 1.15.8 and
      OpenTofu 1.12.6 on v0.35.0. The fix is in v0.40.0, which Terraform 1.15.9
      already ships, so that path clears on the next Terraform bump. The gopls
      and OpenTofu development branches use v0.39.0 and the Terraform Language
      Server one v0.38.0, so none of the other three has a fixed release yet.
  - id: CVE-2026-56865
    paths:
      - "usr/local/bin/gopls"
      - "usr/local/bin/terraform"
      - "usr/local/bin/terraform-ls"
      - "usr/local/bin/tofu"
    expired_at: 2026-10-31
    statement: |
      The vulnerable symbol is tlog.tileHashReader.ReadHashes, reached only
      when a program fetches checksum database tiles through a GOPROXY, and
      none of the four binaries links that package.
      gopls 0.23.0, the latest release, depends on golang.org/x/mod v0.37.0,
      Terraform Language Server 0.39.0 on v0.38.0, and Terraform 1.15.8 and
      OpenTofu 1.12.6 on v0.35.0. The fix is in v0.40.0, which Terraform 1.15.9
      already ships, so that path clears on the next Terraform bump. The gopls
      and OpenTofu development branches use v0.39.0 and the Terraform Language
      Server one v0.38.0, so none of the other three has a fixed release yet.

  - id: CVE-2026-46600
    paths:
      - "usr/local/bin/terraform"
      - "usr/local/bin/tofu"
      - "usr/local/bin/tofu-ls"
    expired_at: 2026-10-31
    statement: |
      Terraform 1.15.8 depends on golang.org/x/net v0.55.0, and OpenTofu 1.12.5
      on v0.54.0. The fix is in v0.56.0, and both upstream development branches
      already use v0.57.0, so the fix is expected in the next release of each.
      OpenTofu Language Server 0.5.3 reaches the same package through the Go
      1.26.0 standard library it was built with, where the fix is in Go 1.26.6.
      The upstream development branch still declares go 1.26.0, so no fixed
      release is available yet.

  - id: CVE-2026-39821
    paths:
      - "usr/local/bin/terraform"
      - "usr/local/bin/terraform-ls"
      - "usr/local/bin/tofu"
      - "usr/local/bin/tofu-ls"
    expired_at: 2026-10-31
    statement: |
      OpenTofu 1.12.5 depends on golang.org/x/net v0.54.0, and the fix is in
      v0.55.0. The upstream development branch already uses v0.57.0, so the fix
      is expected in the next OpenTofu release.
      Terraform 1.15.8, Terraform Language Server 0.39.0 and OpenTofu Language
      Server 0.5.3 reach the same package through the Go standard library they
      were built with, where the fix is in Go 1.25.13 and Go 1.26.6. Terraform
      pins Go 1.26.4 on its development branch and the OpenTofu language server
      still declares go 1.26.0, so neither has a fixed release yet. Terraform
      Language Server tracks the Go 1.25 line, so it picks the fix up on its
      next release.

