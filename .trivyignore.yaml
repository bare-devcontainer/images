      v1.84.0, so the fix is expected in OpenTofu 1.14.0.

  - id: CVE-2026-78669
    paths:
      - "usr/local/bin/terraform-ls"
      - "usr/local/bin/tofu"
      - "usr/local/bin/tofu-ls"
    expired_at: 2026-12-31
    statement: |
      OpenTofu 1.13.2, the latest release, depends on golang.org/x/net v0.57.0
      and OpenTofu Language Server 0.5.3, the latest release, on v0.56.0. The
      fix is in v0.60.0. OpenTofu carries v0.57.0 on the v1.13 branch the next
      patch release comes from and v0.60.0 on the development branch 1.14.0
      comes from, and the OpenTofu Language Server development branch still
      carries v0.56.0, so neither has a fixed release yet. Terraform Language
      Server 0.39.1, the latest release, and OpenTofu Language Server 0.5.3 also
      reach the same package through the Go standard library they were built
      with, Go 1.26.8 and Go 1.26.0, where the fix is in Go 1.26.9 and Go
      1.27.2. The Terraform Language Server development branch pins Go 1.26.8
      and the OpenTofu Language Server development branch still declares go
      1.26.0, so neither has a fixed release yet.

  - id: CVE-2026-78667
    paths:
      - "usr/local/bin/terraform-ls"
      - "usr/local/bin/tofu-ls"
    expired_at: 2026-12-31
    statement: |
      Terraform Language Server 0.39.1, the latest release, was built with Go
      1.26.8 and OpenTofu Language Server 0.5.3, the latest release, with Go
      1.26.0. The fix is in Go 1.26.9 and Go 1.27.2. The Terraform Language
      Server development branch pins Go 1.26.8 and the OpenTofu Language Server
      development branch still declares go 1.26.0, so neither has a fixed
      release yet.
