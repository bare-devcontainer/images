description: "Minimal Dev Container image with Eclipse Temurin JDK: Debian, verified upstreams, SLSA provenance"
materials:
  - path: adoptium-signing-key.asc
    url: https://packages.adoptium.net/artifactory/api/gpg/key/public
    description: >-
      Adoptium's DEB/RPM signing key (fingerprint
      3B04D753C9050D9A5D343F39843C48A565F8F04B), which signs the index of the
      apt repository the Temurin packages are installed from.
# The tag lines carry the upstream JDK version, and the build arg the exact
# version of the Debian package that ships it, so both are read from the apt
# repository index: extractVersion trims the package version
# (25.0.4.1.0+1-0, 21.0.11.0.0+10-1) down to the JDK version (25.0.4.1,
# 21.0.11) the tags carry.
variants:
  - variant: "25-trixie"
    tags:
      # renovate: datasource=deb registryUrl=https://packages.adoptium.net/artifactory/deb?suite=trixie&components=main&binaryArch=amd64 depName=temurin-25-jdk versioning=deb extractVersion=^(?<version>\d+\.\d+\.\d+(?:\.[1-9]\d*)?)(?:\.0)*\+
      - "25.0.4.1-trixie"
      - "25-trixie"
      - "trixie"
      # renovate: datasource=deb registryUrl=https://packages.adoptium.net/artifactory/deb?suite=trixie&components=main&binaryArch=amd64 depName=temurin-25-jdk versioning=deb extractVersion=^(?<version>\d+\.\d+\.\d+(?:\.[1-9]\d*)?)(?:\.0)*\+
      - "25.0.4.1"
      - "25"
    debian_variant: "trixie"
    build_args:
      # renovate: datasource=deb registryUrl=https://packages.adoptium.net/artifactory/deb?suite=trixie&components=main&binaryArch=amd64 depName=temurin-25-jdk versioning=deb
      TEMURIN_VERSION: "25.0.4.1.0+1-0"

  - variant: "25-bookworm"
    tags:
      # renovate: datasource=deb registryUrl=https://packages.adoptium.net/artifactory/deb?suite=bookworm&components=main&binaryArch=amd64 depName=temurin-25-jdk versioning=deb extractVersion=^(?<version>\d+\.\d+\.\d+(?:\.[1-9]\d*)?)(?:\.0)*\+
      - "25.0.4.1-bookworm"
      - "25-bookworm"
      - "bookworm"
    debian_variant: "bookworm"
    build_args:
      # renovate: datasource=deb registryUrl=https://packages.adoptium.net/artifactory/deb?suite=bookworm&components=main&binaryArch=amd64 depName=temurin-25-jdk versioning=deb
      TEMURIN_VERSION: "25.0.4.1.0+1-0"

  - variant: "21-trixie"
    tags:
      # renovate: datasource=deb registryUrl=https://packages.adoptium.net/artifactory/deb?suite=trixie&components=main&binaryArch=amd64 depName=temurin-21-jdk versioning=deb extractVersion=^(?<version>\d+\.\d+\.\d+(?:\.[1-9]\d*)?)(?:\.0)*\+
      - "21.0.12.1-trixie"
      - "21-trixie"
      # renovate: datasource=deb registryUrl=https://packages.adoptium.net/artifactory/deb?suite=trixie&components=main&binaryArch=amd64 depName=temurin-21-jdk versioning=deb extractVersion=^(?<version>\d+\.\d+\.\d+(?:\.[1-9]\d*)?)(?:\.0)*\+
      - "21.0.12.1"
      - "21"
    debian_variant: "trixie"
    build_args:
      # renovate: datasource=deb registryUrl=https://packages.adoptium.net/artifactory/deb?suite=trixie&components=main&binaryArch=amd64 depName=temurin-21-jdk versioning=deb
      TEMURIN_VERSION: "21.0.12.1.0+1-0"

# No 21-bookworm variant: Adoptium's bookworm suite carries no temurin-21-jdk
# newer than 21.0.2 for arm64, while its amd64 packages and the trixie suite
# are current, so the variant cannot be published for both architectures.
