description: "Dev Container image with the Zig compiler, built on Debian"
# The Zig and ZLS signing keys have no direct download URL, so they are not
# managed as materials.
variants:
  - variant: "0.16-trixie"
    tags:
      # renovate: datasource=gitea-tags registryUrl=https://codeberg.org depName=ziglang/zig versioning=semver
      - "0.16.0-trixie"
      - "0.16-trixie"
      - "0-trixie"
      - "trixie"
      # renovate: datasource=gitea-tags registryUrl=https://codeberg.org depName=ziglang/zig versioning=semver
      - "0.16.0"
      - "0.16"
      - "0"
    debian_variant: "trixie"
    build_args:
      # renovate: datasource=gitea-tags registryUrl=https://codeberg.org depName=ziglang/zig versioning=semver
      ZIG_VERSION: "0.16.0"
      # renovate: datasource=github-tags depName=zigtools/zls versioning=semver
      ZLS_VERSION: "0.16.0"
      # renovate: datasource=gitea-commits registryUrl=https://codeberg.org depName=ziglang/shell-completions
      SHELL_COMPLETIONS_COMMIT: "c2983a75dcbcaf3a1df74ab563a9bd3c8e7f448e"

  - variant: "0.16-bookworm"
    tags:
      # renovate: datasource=gitea-tags registryUrl=https://codeberg.org depName=ziglang/zig versioning=semver
      - "0.16.0-bookworm"
      - "0.16-bookworm"
      - "bookworm"
    debian_variant: "bookworm"
    build_args:
      # renovate: datasource=gitea-tags registryUrl=https://codeberg.org depName=ziglang/zig versioning=semver
      ZIG_VERSION: "0.16.0"
      # renovate: datasource=github-tags depName=zigtools/zls versioning=semver
      ZLS_VERSION: "0.16.0"
      # renovate: datasource=gitea-commits registryUrl=https://codeberg.org depName=ziglang/shell-completions
      SHELL_COMPLETIONS_COMMIT: "c2983a75dcbcaf3a1df74ab563a9bd3c8e7f448e"

  - variant: "0.15-trixie"
    tags:
      # renovate: datasource=gitea-tags registryUrl=https://codeberg.org depName=ziglang/zig versioning=semver
      - "0.15.2-trixie"
      - "0.15-trixie"
      # renovate: datasource=gitea-tags registryUrl=https://codeberg.org depName=ziglang/zig versioning=semver
      - "0.15.2"
      - "0.15"
    debian_variant: "trixie"
    build_args:
      # renovate: datasource=gitea-tags registryUrl=https://codeberg.org depName=ziglang/zig versioning=semver
      ZIG_VERSION: "0.15.2"
      # renovate: datasource=github-tags depName=zigtools/zls versioning=semver
      ZLS_VERSION: "0.15.1"
      # renovate: datasource=gitea-commits registryUrl=https://codeberg.org depName=ziglang/shell-completions
      SHELL_COMPLETIONS_COMMIT: "c2983a75dcbcaf3a1df74ab563a9bd3c8e7f448e"

  - variant: "0.15-bookworm"
    tags:
      # renovate: datasource=gitea-tags registryUrl=https://codeberg.org depName=ziglang/zig versioning=semver
      - "0.15.2-bookworm"
      - "0.15-bookworm"
    debian_variant: "bookworm"
    build_args:
      # renovate: datasource=gitea-tags registryUrl=https://codeberg.org depName=ziglang/zig versioning=semver
      ZIG_VERSION: "0.15.2"
      # renovate: datasource=github-tags depName=zigtools/zls versioning=semver
      ZLS_VERSION: "0.15.1"
      # renovate: datasource=gitea-commits registryUrl=https://codeberg.org depName=ziglang/shell-completions
      SHELL_COMPLETIONS_COMMIT: "c2983a75dcbcaf3a1df74ab563a9bd3c8e7f448e"

  # ZIG_VERSION and ZLS_VERSION are kept current by update-zig-master.yml
  # rather than by Renovate.
  - variant: "master-trixie"
    tags:
      - "master-trixie"
      - "master"
    debian_variant: "trixie"
    build_args:
      ZIG_VERSION: "0.17.0-dev.1946+d813faaf0"
      ZLS_VERSION: "0.17.0-dev.44+8da87d4f"
      # renovate: datasource=gitea-commits registryUrl=https://codeberg.org depName=ziglang/shell-completions
      SHELL_COMPLETIONS_COMMIT: "c2983a75dcbcaf3a1df74ab563a9bd3c8e7f448e"
