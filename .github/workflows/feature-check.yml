name: Feature Checks

# Verifies that official Dev Container Features compose with the published
# images, so tooling the images deliberately omit can be added through Features
# instead of being baked in. The Features are layered onto debian, which every
# image extends, and each one is checked by its own script under
# .devcontainer/features.
on:
  schedule:
    # Nightly, after the 00:00 UTC release publishes fresh images, so drift
    # between the images and the Features is caught within a day.
    - cron: '0 3 * * *'
  pull_request:
    paths:
      - .github/workflows/feature-check.yml
      - .devcontainer/feature-debian/**
      - .devcontainer/features/**
      - scripts/check-container-invariants.sh
      - debian/smoke-test.sh
  push:
    branches:
      - main
    paths:
      - .devcontainer/feature-debian/**
      - .devcontainer/features/**
      - scripts/check-container-invariants.sh
      - debian/smoke-test.sh
  workflow_dispatch:

permissions: {}

jobs:
  test:
    permissions:
      contents: read
    # Several Features resolve architecture-specific artifacts, so the container
    # is started on a native runner of each architecture.
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Start the container and run the checks
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          configFile: .devcontainer/feature-debian/devcontainer.json
          push: never
          # The image smoke test runs with the Features layered on, so it doubles
          # as the check that they did not regress the image's own tooling.
          runCmd: |
            # The commands run through a single `bash -c`, whose exit status is
            # that of the last one, so a failure has to stop the sequence here.
            set -e
            bash scripts/check-container-invariants.sh
            bash debian/smoke-test.sh
            for check in .devcontainer/features/*.sh; do
              bash "$check"
            done
