name: Feature Checks

# Verifies that official Dev Container Features compose with the published
# images, so extra tooling can be added through Features instead of being baked
# into the images. Each .devcontainer/feature-<image>-<feature> directory pairs
# one published image with one Feature; the directory name selects both the
# image smoke test and the per-Feature check to run.
on:
  schedule:
    # Nightly, after the 00:00 UTC release publishes fresh images, so drift
    # between the images and the Features is caught within a day.
    - cron: '0 3 * * *'
  pull_request:
    paths:
      - .github/workflows/feature-check.yml
      - .devcontainer/feature-**
      - scripts/check-container-invariants.sh
      - '*/smoke-test.sh'
  push:
    branches:
      - main
    paths:
      - .devcontainer/feature-**
      - scripts/check-container-invariants.sh
      - '*/smoke-test.sh'
  workflow_dispatch:

permissions: {}

jobs:
  setup:
    permissions:
      contents: read
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Build feature matrix
        id: matrix
        run: |
          # Directories are named feature-<image>-<feature>; image names carry no
          # hyphen, so the first segment is the image and the rest is the
          # Feature. Each combination runs on a native amd64 and arm64 runner,
          # since several Features resolve architecture-specific artifacts.
          MATRIX=$(find .devcontainer -maxdepth 1 -type d -name 'feature-*' -printf '%f\n' \
            | sed 's/^feature-//' | sort \
            | jq -R -s -c '[
                split("\n")[:-1][] as $combo
                | ($combo | split("-")) as $parts
                | ("amd64", "arm64")
                | {combo: $combo, image: $parts[0], feature: ($parts[1:] | join("-")), arch: .}
              ]')
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"

  test:
    needs: setup
    permissions:
      contents: read
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.setup.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Start the container and run the checks
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        env:
          MISE_GITHUB_TOKEN: ${{ matrix.image == 'mise' && github.token || '' }}
        with:
          configFile: .devcontainer/feature-${{ matrix.combo }}/devcontainer.json
          push: never
          env: |
            MISE_GITHUB_TOKEN
          # The image smoke tests run with the Feature layered on, so they double
          # as the check that the Feature did not regress the image's own tooling.
          runCmd: |
            bash scripts/check-container-invariants.sh
            bash debian/smoke-test.sh
            if [ "${{ matrix.image }}" != "debian" ]; then
              bash ${{ matrix.image }}/smoke-test.sh
            fi
            bash .devcontainer/features/${{ matrix.feature }}.sh
