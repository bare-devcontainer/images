name: Feature Checks

# Confirms the images work with the Dev Container Features that supply tooling
# the images deliberately omit. Kept separate from build-checks.yml because the
# Features are installed by the Dev Container CLI while it builds the container,
# which cannot be reproduced by running an already built image.
on:
  pull_request:
    paths:
      - .github/workflows/feature-check.yml
      - .devcontainer/feature-**
      - debian/Dockerfile
      - debian/smoke-test.sh
  push:
    branches:
      - main
    paths:
      - .devcontainer/feature-**
      - debian/Dockerfile
      - debian/smoke-test.sh
  workflow_dispatch:

permissions: {}

jobs:
  test:
    permissions:
      contents: read
    # Features resolve architecture-specific artifacts, so every architecture
    # the images are published for needs a native run of its own.
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Build and run the feature tests
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          configFile: .devcontainer/feature-debian/devcontainer.json
          push: never
          runCmd: |
            # runCmd is a single `bash -c`, which reports the status of its last
            # command only.
            set -e
            bash debian/smoke-test.sh
            bash .devcontainer/feature-debian/test.sh
