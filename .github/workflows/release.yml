name: Release

on:
  schedule:
    - cron: '0 0 * * *'
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/workflows/publish-image.yml
      - scripts/build-config.sh
      - scripts/changed-images.sh
      - scripts/changed-variants.sh
  workflow_dispatch:
    inputs:
      overwrite:
        description: 'Overwrite existing tags'
        required: true
        type: boolean
        default: false
      force:
        description: 'Build every variant, even those unchanged since the last release'
        required: true
        type: boolean
        default: false

# PR dry-runs use a per-PR group so they never queue against real releases.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('publish-pr-{0}', github.event.pull_request.number) || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}
cache-mode: none

defaults:
  run:
    shell: bash -euo pipefail {0}

env:
  BASE_IMAGE_REF: ghcr.io/${{ github.repository_owner }}/debian

jobs:
  published-base:
    permissions:
      contents: read
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      latest_tag: ${{ steps.list.outputs.latest_tag }}
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the release tags can be resolved.
          fetch-depth: 0
          persist-credentials: false
      - name: List the published base tags
        id: list
        run: |
          LATEST_TAG=$(git tag --list 'v[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]' | sort | tail -1)
          echo "latest_tag=${LATEST_TAG}" >> "$GITHUB_OUTPUT"
          MATRIX='[]'
          if [ -n "$LATEST_TAG" ]; then
            # The build.yaml of the latest release names the tags the registry
            # holds, even when main has moved on.
            git checkout -q "$LATEST_TAG"
            MATRIX=$(bash scripts/build-config.sh variants debian | jq -r '.[]' \
              | while read -r variant; do
                  jq -n -c --arg variant "$variant" \
                    --arg tag "$(bash scripts/build-config.sh primary-tag debian "$variant")" \
                    '{variant: $variant, tag: $tag}'
                done | jq -s -c '[.[] as $m | ("amd64", "arm64") | $m + {arch: .}]')
          fi
          echo "Published base at ${LATEST_TAG:-no release}: ${MATRIX}"
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"

  # The base runs apt-get upgrade on every build, so a rebuild installs every
  # Debian security update the archive holds for the packages it ships. This
  # asks apt in the published base what such a rebuild would install now.
  check-base:
    permissions: {}
    needs: [published-base]
    if: needs.published-base.outputs.matrix != '[]'
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.published-base.outputs.matrix) }}
    steps:
      - name: Check for pending security updates
        id: check
        env:
          IMAGE: ${{ env.BASE_IMAGE_REF }}:${{ matrix.tag }}
          ARCH: ${{ matrix.arch }}
          UPDATES: ${{ runner.temp }}/updates.md
        run: |
          # apt-get -s names the Label of the Release file each version comes
          # from, which is Debian-Security for the security archive. A held
          # back upgrade has no Inst line, as a rebuild would not install it.
          SIMULATION=$(docker run --rm --pull always --platform "linux/${ARCH}" --user root "$IMAGE" \
            sh -euc 'apt-get update -qq >&2 && apt-get -s upgrade')
          sed -nE "s|^Inst ([^ ]+) \[([^]]+)\] \(([^ ]+) Debian-Security:.*|- \`${IMAGE}\` (${ARCH}): \1 \2 → \3|p" \
            <<< "$SIMULATION" > "$UPDATES"
          if [ ! -s "$UPDATES" ]; then
            echo "No pending security update in ${IMAGE} (${ARCH})."
            exit 0
          fi
          {
            echo "### Pending security updates in ${IMAGE} (${ARCH})"
            cat "$UPDATES"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "found=true" >> "$GITHUB_OUTPUT"
      - name: Upload pending updates
        if: steps.check.outputs.found == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: base-updates-${{ matrix.variant }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/updates.md
          if-no-files-found: error
          retention-days: 1

  setup:
    permissions:
      contents: read
    needs: [published-base, check-base]
    # A failed check holds back neither the release nor what the other check
    # legs found; the Monday rebuild still catches what it missed.
    if: ${{ !cancelled() && needs.published-base.result == 'success' }}
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      build_date: ${{ steps.init.outputs.build_date }}
      should_run: ${{ steps.select.outputs.should_run }}
      matrix: ${{ steps.select.outputs.matrix }}
      base_variants: ${{ steps.select.outputs.base_variants }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the release tags and the diff from the latest one
          # can be resolved.
          fetch-depth: 0
          persist-credentials: false
      - name: Download pending base updates
        if: needs.check-base.result != 'skipped'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: base-updates-*
          path: ${{ runner.temp }}/base-updates
      - name: Resolve release scope
        id: init
        env:
          EVENT_NAME: ${{ github.event_name }}
          FORCE: ${{ inputs.force || false }}
          LATEST_TAG: ${{ needs.published-base.outputs.latest_tag }}
          CHECK_RESULT: ${{ needs.check-base.result }}
          UPDATES_DIR: ${{ runner.temp }}/base-updates
          BASE_UPDATES: ${{ runner.temp }}/base-updates.md
        run: |
          BUILD_DATE=$(date -u +%Y%m%d)
          echo "build_date=${BUILD_DATE}" >> "$GITHUB_OUTPUT"
          echo "latest_tag=${LATEST_TAG}" >> "$GITHUB_OUTPUT"

          if [ "${CHECK_RESULT}" = "failure" ]; then
            echo "::warning::The security update check of the published base failed; only the tags it did check are judged."
          fi
          if [ -d "$UPDATES_DIR" ]; then
            find "$UPDATES_DIR" -type f -name '*.md' -print0 | sort -z | xargs -0 -r cat > "$BASE_UPDATES"
          fi

          every_variant() {
            echo "Building every variant: $1."
            echo "scope=all" >> "$GITHUB_OUTPUT"
            echo "scope_reason=$1" >> "$GITHUB_OUTPUT"
            exit 0
          }

          if [ "${EVENT_NAME}" = "pull_request" ]; then
            every_variant "pull request dry run"
          fi
          if [ "${FORCE}" = "true" ]; then
            every_variant "force run requested"
          fi
          # Guarantee at least one release per week so Debian security
          # updates from the package archive are picked up even when no
          # variant has changed since the last release.
          if [ "${EVENT_NAME}" = "schedule" ] && [ "$(date -u +%u)" = "1" ]; then
            every_variant "weekly scheduled rebuild"
          fi
          if [ -s "$BASE_UPDATES" ]; then
            every_variant "Debian security updates pending in the published base"
          fi
          if [ -z "$LATEST_TAG" ]; then
            every_variant "no release tag found"
          fi

          echo "Building the variants changed since ${LATEST_TAG}."
          echo "scope=changed" >> "$GITHUB_OUTPUT"
      - name: Select variants
        id: select
        env:
          SCOPE: ${{ steps.init.outputs.scope }}
          LATEST_TAG: ${{ steps.init.outputs.latest_tag }}
          CHANGED_FILES: ${{ runner.temp }}/changed-files.txt
        run: |
          # The diff is reported even when the scope is every variant, so the
          # release rules stay verifiable from the log.
          MATRIX='[]'
          BASE_VARIANTS='[]'
          if [ -n "$LATEST_TAG" ]; then
            echo "=== Changed files (${LATEST_TAG}..HEAD) ==="
            git diff --name-only "$LATEST_TAG" HEAD | tee "$CHANGED_FILES"

            REPORT=$(bash scripts/changed-variants.sh "$LATEST_TAG" "$CHANGED_FILES")
            echo "=== Variants changed since ${LATEST_TAG} ==="
            echo "$REPORT" | jq -r '.[] |
              "[" + (if .selected then "CHANGED" else "       " end) + "] "
              + .image + ":" + .variant + ": " + .reason'
            # build-base publishes the base before build-image builds anything
            # FROM it, so the debian variants go into a matrix of their own.
            BASE_VARIANTS=$(echo "$REPORT" | jq -c '[.[] | select(.selected and .image == "debian") | .variant]')
            MATRIX=$(echo "$REPORT" | jq -c '[.[] | select(.selected and .image != "debian") | {image, variant, primary_tag}]')
          fi

          if [ "$SCOPE" = "all" ]; then
            BASE_VARIANTS=$(bash scripts/build-config.sh variants debian | jq -c .)
            MATRIX=$(bash scripts/build-config.sh all-matrix)
          fi
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"
          echo "base_variants=${BASE_VARIANTS}" >> "$GITHUB_OUTPUT"

          if [ "$MATRIX" = "[]" ] && [ "$BASE_VARIANTS" = "[]" ]; then
            echo "No variant changed since ${LATEST_TAG}, skipping."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

          echo "=== Build targets ==="
          echo "Base variants:"
          echo "$BASE_VARIANTS" | jq -r '.[] | "  " + .'
          echo "Other images:"
          echo "$MATRIX" | jq -r '.[] | "  " + .image + ":" + .primary_tag'
      - name: Write release notes
        if: steps.select.outputs.should_run == 'true'
        env:
          BUILD_DATE: ${{ steps.init.outputs.build_date }}
          LATEST_TAG: ${{ steps.init.outputs.latest_tag }}
          SCOPE: ${{ steps.init.outputs.scope }}
          SCOPE_REASON: ${{ steps.init.outputs.scope_reason }}
          BASE_UPDATES: ${{ runner.temp }}/base-updates.md
          MATRIX: ${{ steps.select.outputs.matrix }}
          BASE_VARIANTS: ${{ steps.select.outputs.base_variants }}
          REPO_OWNER: ${{ github.repository_owner }}
          BASE_IMAGE_REF: ${{ env.BASE_IMAGE_REF }}
          README_URL: ${{ github.server_url }}/${{ github.repository }}/blob/main/README.md
          RELEASE_NOTES: ${{ runner.temp }}/release-notes.md
        run: |
          {
            if [ "$SCOPE" = "all" ]; then
              echo "Scope: every variant (${SCOPE_REASON})"
            else
              echo "Scope: variants changed since ${LATEST_TAG}"
            fi
            echo ""
            if [ -s "$BASE_UPDATES" ]; then
              echo "### Debian security updates in the rebuilt base"
              cat "$BASE_UPDATES"
              echo ""
            fi
            if [ -n "$LATEST_TAG" ]; then
              echo "### Image changes since ${LATEST_TAG}"
              # git log takes paths, so this is the coarser view of a selection
              # that reads the variant definitions as well: a commit that
              # changed another variant of a selected image is listed too. The
              # exclusions mirror the patterns changed-images.sh drops.
              PATHS=$(jq -r -n --argjson matrix "$MATRIX" --argjson base "$BASE_VARIANTS" \
                '[$matrix[].image] + (if ($base | length) > 0 then ["debian"] else [] end)
                 | unique | "src/" + .[] + "/"')
              mapfile -t IMAGE_PATHS <<< "$PATHS"
              # shellcheck disable=SC2016  # backticks are literal Markdown code spans
              UPDATES=$(git log --format='- `%h` %s' "${LATEST_TAG}..HEAD" \
                -- "${IMAGE_PATHS[@]}" ':(exclude)*.md' ':(exclude)src/*/smoke-test.sh')
              if [ -n "$UPDATES" ]; then
                echo "$UPDATES"
              else
                echo "_No file of these images changed since ${LATEST_TAG}._"
              fi
            else
              echo "_No previous release tag found._"
            fi
            echo ""
            echo "### Variants to be pushed"
            echo ""
            if [ "$BASE_VARIANTS" != "[]" ]; then
              echo "**Debian base:**"
              echo "$BASE_VARIANTS" | jq -r '.[]' | while read -r variant; do
                echo "- \`${BASE_IMAGE_REF}:${variant}-${BUILD_DATE}\`"
              done
              echo ""
            fi
            if [ "$MATRIX" != "[]" ]; then
              echo "**Other images:**"
              echo "$MATRIX" | jq -r \
                '.[] | "- `ghcr.io/" + env.REPO_OWNER + "/" + .image + ":" + .primary_tag + "-" + env.BUILD_DATE + "`"'
              echo ""
            fi
            echo "### Verifying these images"
            echo ""
            echo "Every tag above ships an attestation, build provenance and an SBOM."
            echo "See [Verifying Published Images](${README_URL}#verifying-published-images)"
            echo "for the commands that check them."
          } > "$RELEASE_NOTES"
          {
            echo "## Release: v${BUILD_DATE}"
            echo ""
            cat "$RELEASE_NOTES"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload release notes
        if: steps.select.outputs.should_run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error
          retention-days: 1

  gate:
    permissions: {}
    needs: [setup]
    # Skipping the build jobs on PRs from forks. !cancelled() keeps a failed
    # check-base from skipping this, so the setup result is checked explicitly.
    if: >-
      ${{ !cancelled() &&
      needs.setup.result == 'success' &&
      needs.setup.outputs.should_run == 'true' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository) }}
    environment: ${{ github.event_name != 'pull_request' && 'release' || 'ci' }}
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Gate
        run: echo "Release gate passed"

  build-base:
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
      packages: write
    cache-mode: write
    needs: [setup, gate]
    # !cancelled() for the same reason as in gate.
    if: >-
      ${{ !cancelled() &&
      needs.gate.result == 'success' &&
      needs.setup.outputs.base_variants != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJson(needs.setup.outputs.base_variants) }}
    uses: ./.github/workflows/publish-image.yml
    with:
      image: debian
      variant: ${{ matrix.variant }}
      image_ref: ghcr.io/${{ github.repository_owner }}/debian
      build_date: ${{ needs.setup.outputs.build_date }}
      overwrite: ${{ inputs.overwrite || false }}
      dryrun: ${{ github.event_name == 'pull_request' }}

  build-image:
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
      packages: write
    cache-mode: write
    needs: [setup, gate, build-base]
    # !cancelled() lets this run when build-base was skipped, so every other
    # needed result is checked explicitly.
    if: >-
      ${{ !cancelled() &&
      needs.setup.outputs.should_run == 'true' &&
      needs.gate.result == 'success' &&
      (needs.build-base.result == 'success' || needs.build-base.result == 'skipped') &&
      needs.setup.outputs.matrix != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.setup.outputs.matrix) }}
    uses: ./.github/workflows/publish-image.yml
    with:
      image: ${{ matrix.image }}
      variant: ${{ matrix.variant }}
      image_ref: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
      build_date: ${{ needs.setup.outputs.build_date }}
      overwrite: ${{ inputs.overwrite || false }}
      dryrun: ${{ github.event_name == 'pull_request' }}

  # Not a dependency of create-release: the images are published once they
  # reach GHCR, so a mirror failure must not hold back the release.
  mirror:
    permissions:
      contents: read
      packages: read
    needs: [setup, gate, build-base, build-image]
    if: >-
      ${{ !cancelled() &&
      needs.setup.outputs.should_run == 'true' &&
      github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
      needs.gate.result == 'success' &&
      (needs.build-base.result == 'success' || needs.build-base.result == 'skipped') &&
      (needs.build-image.result == 'success' || needs.build-image.result == 'skipped') }}
    uses: ./.github/workflows/mirror.yml
    with:
      build_date: ${{ needs.setup.outputs.build_date }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_PAT: ${{ secrets.DOCKERHUB_PAT }}

  create-release:
    permissions:
      actions: write
      contents: write
    needs: [setup, gate, build-base, build-image]
    if: >-
      ${{ !cancelled() &&
      needs.setup.outputs.should_run == 'true' &&
      github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
      needs.gate.result == 'success' &&
      (needs.build-base.result == 'success' || needs.build-base.result == 'skipped') &&
      (needs.build-image.result == 'success' || needs.build-image.result == 'skipped') }}
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Download release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          BUILD_DATE: ${{ needs.setup.outputs.build_date }}
          RELEASE_NOTES: ${{ runner.temp }}/release-notes.md
        run: |
          if gh api "repos/${REPO}/git/ref/tags/v${BUILD_DATE}" > /dev/null 2>&1; then
            echo "Tag v${BUILD_DATE} already exists, skipping."
          else
            # gh creates the tag at --target when it does not exist yet.
            gh release create "v${BUILD_DATE}" \
              --repo "${REPO}" \
              --target "${SHA}" \
              --title "v${BUILD_DATE}" \
              --notes-file "${RELEASE_NOTES}"
            echo "Created release v${BUILD_DATE}."
            gh workflow run trivy.yml \
              --repo "${REPO}" \
              --ref main
          fi

  update-readme:
    permissions:
      contents: read
    needs: [setup, create-release]
    if: >-
      ${{ !cancelled() &&
      needs.setup.outputs.should_run == 'true' &&
      github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
      needs.create-release.result == 'success' }}
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Regenerate README tag tables
        id: regen
        run: |
          ./scripts/update-readme.sh
          if git diff --quiet; then
            echo "READMEs are already in sync with build.yaml."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --name-only
          fi

      - name: Generate GitHub App Token
        id: app-token
        if: steps.regen.outputs.changed == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.HOUSEKEEPER_CLIENT_ID }}
          private-key: ${{ secrets.HOUSEKEEPER_PRIVATE_KEY }}

      - name: Open pull request
        if: steps.regen.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BUILD_DATE: ${{ needs.setup.outputs.build_date }}
        run: |
          bash scripts/housekeeper-pr.sh \
            --branch "housekeeper/update-readme-tags-${BUILD_DATE}" \
            --title "docs: update README tag tables" \
            --body "Automated regeneration of image README tag tables from each image's \`build.yaml\` after release v${BUILD_DATE}."
