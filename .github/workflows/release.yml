name: Release

on:
  schedule:
    - cron: '0 0 * * *'
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/workflows/publish-image.yml
      - scripts/build-config.sh
      - scripts/changed-images.sh
      - scripts/changed-variants.sh
  workflow_dispatch:
    inputs:
      overwrite:
        description: 'Overwrite existing tags'
        required: true
        type: boolean
        default: false
      force:
        description: 'Build every variant, even those unchanged since the last release'
        required: true
        type: boolean
        default: false

# PR dry-runs use a per-PR group so they never queue against real releases.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('publish-pr-{0}', github.event.pull_request.number) || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}
cache-mode: none

defaults:
  run:
    shell: bash -euo pipefail {0}

env:
  BASE_IMAGE_REF: ghcr.io/${{ github.repository_owner }}/debian

jobs:
  setup:
    permissions:
      contents: read
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      build_date: ${{ steps.init.outputs.build_date }}
      should_run: ${{ steps.select.outputs.should_run }}
      matrix: ${{ steps.select.outputs.matrix }}
      base_variants: ${{ steps.select.outputs.base_variants }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the release tags and the diff from the latest one
          # can be resolved.
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve release scope
        id: init
        env:
          EVENT_NAME: ${{ github.event_name }}
          FORCE: ${{ inputs.force || false }}
        run: |
          BUILD_DATE=$(date -u +%Y%m%d)
          echo "build_date=${BUILD_DATE}" >> "$GITHUB_OUTPUT"

          LATEST_TAG=$(git tag --list 'v[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]' | sort | tail -1)
          echo "latest_tag=${LATEST_TAG}" >> "$GITHUB_OUTPUT"

          every_variant() {
            echo "Building every variant: $1."
            echo "scope=all" >> "$GITHUB_OUTPUT"
            echo "scope_reason=$1" >> "$GITHUB_OUTPUT"
            exit 0
          }

          if [ "${EVENT_NAME}" = "pull_request" ]; then
            every_variant "pull request dry run"
          fi
          if [ "${FORCE}" = "true" ]; then
            every_variant "force run requested"
          fi
          # Guarantee at least one release per week so Debian security
          # updates from the package archive are picked up even when no
          # variant has changed since the last release.
          if [ "${EVENT_NAME}" = "schedule" ] && [ "$(date -u +%u)" = "1" ]; then
            every_variant "weekly scheduled rebuild"
          fi
          if [ -z "$LATEST_TAG" ]; then
            every_variant "no release tag found"
          fi

          echo "Building the variants changed since ${LATEST_TAG}."
          echo "scope=changed" >> "$GITHUB_OUTPUT"
      - name: Select variants
        id: select
        env:
          SCOPE: ${{ steps.init.outputs.scope }}
          LATEST_TAG: ${{ steps.init.outputs.latest_tag }}
          CHANGED_FILES: ${{ runner.temp }}/changed-files.txt
        run: |
          # The diff is reported even when the scope is every variant, so the
          # release rules stay verifiable from the log.
          MATRIX='[]'
          BASE_VARIANTS='[]'
          SKIPPED='[]'
          if [ -n "$LATEST_TAG" ]; then
            echo "=== Changed files (${LATEST_TAG}..HEAD) ==="
            git diff --name-only "$LATEST_TAG" HEAD | tee "$CHANGED_FILES"

            REPORT=$(bash scripts/changed-variants.sh "$LATEST_TAG" "$CHANGED_FILES")
            echo "=== Variants changed since ${LATEST_TAG} ==="
            echo "$REPORT" | jq -r '.[] |
              "[" + (if .selected then "CHANGED" else "       " end) + "] "
              + .image + ":" + .variant + ": " + .reason'
            # build-base publishes the base before build-image builds anything
            # FROM it, so the debian variants go into a matrix of their own.
            BASE_VARIANTS=$(echo "$REPORT" | jq -c '[.[] | select(.selected and .image == "debian") | .variant]')
            MATRIX=$(echo "$REPORT" | jq -c '[.[] | select(.selected and .image != "debian") | {image, variant, primary_tag}]')
            SKIPPED=$(echo "$REPORT" | jq -c '[.[] | select(.selected | not) | {image, primary_tag}]')
          fi

          if [ "$SCOPE" = "all" ]; then
            BASE_VARIANTS=$(bash scripts/build-config.sh variants debian | jq -c .)
            MATRIX=$(bash scripts/build-config.sh all-matrix)
            SKIPPED='[]'
          fi
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"
          echo "base_variants=${BASE_VARIANTS}" >> "$GITHUB_OUTPUT"
          echo "skipped=${SKIPPED}" >> "$GITHUB_OUTPUT"

          if [ "$MATRIX" = "[]" ] && [ "$BASE_VARIANTS" = "[]" ]; then
            echo "No variant changed since ${LATEST_TAG}, skipping."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

          echo "=== Build targets ==="
          echo "Base variants:"
          echo "$BASE_VARIANTS" | jq -r '.[] | "  " + .'
          echo "Other images:"
          echo "$MATRIX" | jq -r '.[] | "  " + .image + ":" + .primary_tag'
      - name: Write release notes
        if: steps.select.outputs.should_run == 'true'
        env:
          BUILD_DATE: ${{ steps.init.outputs.build_date }}
          LATEST_TAG: ${{ steps.init.outputs.latest_tag }}
          SCOPE: ${{ steps.init.outputs.scope }}
          SCOPE_REASON: ${{ steps.init.outputs.scope_reason }}
          SKIPPED: ${{ steps.select.outputs.skipped }}
          MATRIX: ${{ steps.select.outputs.matrix }}
          BASE_VARIANTS: ${{ steps.select.outputs.base_variants }}
          REPO_OWNER: ${{ github.repository_owner }}
          BASE_IMAGE_REF: ${{ env.BASE_IMAGE_REF }}
          RELEASE_NOTES: ${{ runner.temp }}/release-notes.md
        run: |
          {
            if [ "$SCOPE" = "all" ]; then
              echo "Scope: every variant (${SCOPE_REASON})"
            else
              echo "Scope: variants changed since ${LATEST_TAG}"
            fi
            echo ""
            if [ -n "$LATEST_TAG" ]; then
              echo "### Image changes since ${LATEST_TAG}"
              # git log takes paths, so this is the coarser view of a selection
              # that reads the variant definitions as well: a commit that
              # changed another variant of a selected image is listed too. The
              # exclusions mirror the patterns changed-images.sh drops.
              PATHS=$(jq -r -n --argjson matrix "$MATRIX" --argjson base "$BASE_VARIANTS" \
                '[$matrix[].image] + (if ($base | length) > 0 then ["debian"] else [] end)
                 | unique | .[] + "/"')
              mapfile -t IMAGE_PATHS <<< "$PATHS"
              # shellcheck disable=SC2016  # backticks are literal Markdown code spans
              UPDATES=$(git log --format='- `%h` %s' "${LATEST_TAG}..HEAD" \
                -- "${IMAGE_PATHS[@]}" ':(exclude)*.md' ':(exclude)*/smoke-test.sh')
              if [ -n "$UPDATES" ]; then
                echo "$UPDATES"
              else
                echo "_No file of these images changed since ${LATEST_TAG}._"
              fi
            else
              echo "_No previous release tag found._"
            fi
            echo ""
            echo "### Variants to be pushed"
            echo ""
            if [ "$BASE_VARIANTS" != "[]" ]; then
              echo "**Debian base:**"
              echo "$BASE_VARIANTS" | jq -r '.[]' | while read -r variant; do
                echo "- \`${BASE_IMAGE_REF}:${variant}-${BUILD_DATE}\`"
              done
              echo ""
            fi
            if [ "$MATRIX" != "[]" ]; then
              echo "**Other images:**"
              echo "$MATRIX" | jq -r \
                '.[] | "- `ghcr.io/" + env.REPO_OWNER + "/" + .image + ":" + .primary_tag + "-" + env.BUILD_DATE + "`"'
              echo ""
            fi
            if [ "$SKIPPED" != "[]" ]; then
              echo "### Variants left at their previous build"
              echo ""
              echo "$SKIPPED" | jq -r \
                'group_by(.image)[] | "- `ghcr.io/" + env.REPO_OWNER + "/" + .[0].image + "`: "
                 + (map(.primary_tag) | join(", "))'
            fi
          } > "$RELEASE_NOTES"
          {
            echo "## Release: v${BUILD_DATE}"
            echo ""
            cat "$RELEASE_NOTES"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload release notes
        if: steps.select.outputs.should_run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error
          retention-days: 1

  gate:
    permissions: {}
    needs: [setup]
    # Skipping the build jobs on PRs from forks.
    if: >-
      needs.setup.outputs.should_run == 'true' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    environment: ${{ github.event_name != 'pull_request' && 'release' || 'ci' }}
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Gate
        run: echo "Release gate passed"

  build-base:
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
      packages: write
    cache-mode: write
    needs: [setup, gate]
    if: needs.setup.outputs.should_run == 'true' && needs.setup.outputs.base_variants != '[]'
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJson(needs.setup.outputs.base_variants) }}
    uses: ./.github/workflows/publish-image.yml
    with:
      image: debian
      variant: ${{ matrix.variant }}
      image_ref: ghcr.io/${{ github.repository_owner }}/debian
      build_date: ${{ needs.setup.outputs.build_date }}
      overwrite: ${{ inputs.overwrite || false }}
      dryrun: ${{ github.event_name == 'pull_request' }}

  build-image:
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
      packages: write
    cache-mode: write
    needs: [setup, gate, build-base]
    # !cancelled() lets this run when build-base was skipped, so every other
    # needed result is checked explicitly.
    if: >-
      ${{ !cancelled() &&
      needs.setup.outputs.should_run == 'true' &&
      needs.gate.result == 'success' &&
      (needs.build-base.result == 'success' || needs.build-base.result == 'skipped') &&
      needs.setup.outputs.matrix != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.setup.outputs.matrix) }}
    uses: ./.github/workflows/publish-image.yml
    with:
      image: ${{ matrix.image }}
      variant: ${{ matrix.variant }}
      image_ref: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
      build_date: ${{ needs.setup.outputs.build_date }}
      overwrite: ${{ inputs.overwrite || false }}
      dryrun: ${{ github.event_name == 'pull_request' }}

  # Not a dependency of create-release: the images are published once they
  # reach GHCR, so a mirror failure must not hold back the release.
  mirror:
    permissions:
      contents: read
      packages: read
    needs: [setup, gate, build-base, build-image]
    if: >-
      ${{ !cancelled() &&
      needs.setup.outputs.should_run == 'true' &&
      github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
      needs.gate.result == 'success' &&
      (needs.build-base.result == 'success' || needs.build-base.result == 'skipped') &&
      (needs.build-image.result == 'success' || needs.build-image.result == 'skipped') }}
    uses: ./.github/workflows/mirror.yml
    with:
      build_date: ${{ needs.setup.outputs.build_date }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_PAT: ${{ secrets.DOCKERHUB_PAT }}

  create-release:
    permissions:
      actions: write
      contents: write
    needs: [setup, gate, build-base, build-image]
    if: >-
      ${{ !cancelled() &&
      needs.setup.outputs.should_run == 'true' &&
      github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
      needs.gate.result == 'success' &&
      (needs.build-base.result == 'success' || needs.build-base.result == 'skipped') &&
      (needs.build-image.result == 'success' || needs.build-image.result == 'skipped') }}
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Download release notes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes
          path: ${{ runner.temp }}
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          BUILD_DATE: ${{ needs.setup.outputs.build_date }}
          RELEASE_NOTES: ${{ runner.temp }}/release-notes.md
        run: |
          if gh api "repos/${REPO}/git/ref/tags/v${BUILD_DATE}" > /dev/null 2>&1; then
            echo "Tag v${BUILD_DATE} already exists, skipping."
          else
            # gh creates the tag at --target when it does not exist yet.
            gh release create "v${BUILD_DATE}" \
              --repo "${REPO}" \
              --target "${SHA}" \
              --title "v${BUILD_DATE}" \
              --notes-file "${RELEASE_NOTES}"
            echo "Created release v${BUILD_DATE}."
            gh workflow run trivy.yml \
              --repo "${REPO}" \
              --ref main
          fi

  update-readme:
    permissions:
      contents: read
    needs: [setup, create-release]
    if: >-
      ${{ !cancelled() &&
      needs.setup.outputs.should_run == 'true' &&
      github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
      needs.create-release.result == 'success' }}
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Regenerate README tag tables
        id: regen
        run: |
          ./scripts/update-readme.sh
          if git diff --quiet; then
            echo "READMEs are already in sync with build.yaml."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --name-only
          fi

      - name: Generate GitHub App Token
        id: app-token
        if: steps.regen.outputs.changed == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.HOUSEKEEPER_CLIENT_ID }}
          private-key: ${{ secrets.HOUSEKEEPER_PRIVATE_KEY }}

      - name: Open pull request
        if: steps.regen.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BUILD_DATE: ${{ needs.setup.outputs.build_date }}
        run: |
          bash scripts/housekeeper-pr.sh \
            --branch "housekeeper/update-readme-tags-${BUILD_DATE}" \
            --title "docs: update README tag tables" \
            --body "Automated regeneration of image README tag tables from each image's \`build.yaml\` after release v${BUILD_DATE}."
