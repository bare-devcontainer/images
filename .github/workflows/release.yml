name: Release

on:
  schedule:
    - cron: '0 0 * * *'
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/workflows/publish-image.yml
      - scripts/changed-images.sh
  workflow_dispatch:
    inputs:
      overwrite:
        description: 'Overwrite existing tags'
        required: true
        type: boolean
        default: false
      force:
        description: 'Build every image, even those unchanged since the last release'
        required: true
        type: boolean
        default: false

# PR dry-runs use a per-PR group so they never queue against real releases.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('publish-pr-{0}', github.event.pull_request.number) || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

env:
  BASE_IMAGE_REF: ghcr.io/${{ github.repository_owner }}/debian

jobs:
  setup:
    permissions:
      contents: read
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      build_date: ${{ steps.init.outputs.build_date }}
      should_run: ${{ steps.select.outputs.should_run }}
      images: ${{ steps.select.outputs.images }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      base_variants: ${{ steps.matrix.outputs.base_variants }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the release tags and the diff from the latest one
          # can be resolved.
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve release scope
        id: init
        env:
          EVENT_NAME: ${{ github.event_name }}
          FORCE: ${{ inputs.force || false }}
        run: |
          BUILD_DATE=$(date -u +%Y%m%d)
          echo "build_date=${BUILD_DATE}" >> "$GITHUB_OUTPUT"

          LATEST_TAG=$(git tag --list 'v[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]' | sort | tail -1)
          echo "latest_tag=${LATEST_TAG}" >> "$GITHUB_OUTPUT"

          every_image() {
            echo "Building every image: $1."
            echo "scope=all" >> "$GITHUB_OUTPUT"
            echo "scope_reason=$1" >> "$GITHUB_OUTPUT"
            exit 0
          }

          if [ "${EVENT_NAME}" = "pull_request" ]; then
            every_image "pull request dry run"
          fi
          if [ "${FORCE}" = "true" ]; then
            every_image "force run requested"
          fi
          # Guarantee at least one release per week so Debian security
          # updates from the package archive are picked up even when no
          # image has changed since the last release.
          if [ "${EVENT_NAME}" = "schedule" ] && [ "$(date -u +%u)" = "1" ]; then
            every_image "weekly scheduled rebuild"
          fi
          if [ -z "$LATEST_TAG" ]; then
            every_image "no release tag found"
          fi
          # A failed weekly rebuild leaves no tag, so the guarantee above is
          # carried over to the first release after a week without one.
          if [ "$(( ($(date -u +%s) - $(date -u -d "${LATEST_TAG#v}" +%s)) / 86400 ))" -ge 7 ]; then
            every_image "latest release ${LATEST_TAG} is over a week old"
          fi

          echo "Building the images changed since ${LATEST_TAG}."
          echo "scope=changed" >> "$GITHUB_OUTPUT"
      - name: Select images
        id: select
        env:
          SCOPE: ${{ steps.init.outputs.scope }}
          LATEST_TAG: ${{ steps.init.outputs.latest_tag }}
          CHANGED_FILES: ${{ runner.temp }}/changed-files.txt
        run: |
          # Reported whenever a release tag exists, even for a run that builds
          # every image, so the selection can be verified from the log.
          IMAGES='[]'
          SKIPPED='[]'
          if [ -n "$LATEST_TAG" ]; then
            echo "=== Changed files (${LATEST_TAG}..HEAD) ==="
            git diff --name-only "$LATEST_TAG" HEAD | tee "$CHANGED_FILES"

            REPORT=$(bash scripts/changed-images.sh release "$CHANGED_FILES")
            echo "=== Images changed since ${LATEST_TAG} ==="
            echo "$REPORT" | jq -r '.[] |
              "[" + (if .selected then "RUN " else "SKIP" end) + "] " + .image + ": " + .reason,
              (.files[] | "         " + .)'
            IMAGES=$(echo "$REPORT" | jq -c '[.[] | select(.selected) | .image]')
            SKIPPED=$(echo "$REPORT" | jq -c '[.[] | select(.selected | not) | .image]')
          fi

          if [ "$SCOPE" = "all" ]; then
            IMAGES=$(bash scripts/build-config.sh images)
            SKIPPED='[]'
          fi
          echo "images=${IMAGES}" >> "$GITHUB_OUTPUT"
          echo "skipped=${SKIPPED}" >> "$GITHUB_OUTPUT"

          if [ "$IMAGES" = "[]" ]; then
            echo "No image changed since ${LATEST_TAG}, skipping."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build image matrix
        id: matrix
        env:
          IMAGES: ${{ steps.select.outputs.images }}
        run: |
          MATRIX=$(bash scripts/build-config.sh all-matrix \
            | jq -c --argjson selected "$IMAGES" '[.[] | select(.image | IN($selected[]))]')
          # A debian change selects every image, so the base variants are all
          # or nothing.
          if echo "$IMAGES" | jq -e 'any(. == "debian")' > /dev/null; then
            BASE_VARIANTS=$(bash scripts/build-config.sh variants debian | jq -c .)
          else
            BASE_VARIANTS='[]'
          fi
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"
          echo "base_variants=${BASE_VARIANTS}" >> "$GITHUB_OUTPUT"

          echo "=== Build targets ==="
          echo "Base variants:"
          echo "$BASE_VARIANTS" | jq -r '.[] | "  " + .'
          echo "Other images:"
          echo "$MATRIX" | jq -r '.[] | "  " + .image + ":" + .primary_tag'
      - name: Write release summary
        if: steps.select.outputs.should_run == 'true'
        env:
          BUILD_DATE: ${{ steps.init.outputs.build_date }}
          LATEST_TAG: ${{ steps.init.outputs.latest_tag }}
          SCOPE: ${{ steps.init.outputs.scope }}
          SCOPE_REASON: ${{ steps.init.outputs.scope_reason }}
          SKIPPED: ${{ steps.select.outputs.skipped }}
          MATRIX: ${{ steps.matrix.outputs.matrix }}
          BASE_VARIANTS: ${{ steps.matrix.outputs.base_variants }}
          REPO_OWNER: ${{ github.repository_owner }}
          BASE_IMAGE_REF: ${{ env.BASE_IMAGE_REF }}
        run: |
          {
            echo "## Release: v${BUILD_DATE}"
            echo ""
            if [ "$SCOPE" = "all" ]; then
              echo "Scope: every image (${SCOPE_REASON})"
            else
              echo "Scope: images changed since ${LATEST_TAG}"
            fi
            echo ""
            if [ -n "$LATEST_TAG" ]; then
              echo "### Image updates since ${LATEST_TAG}"
              # shellcheck disable=SC2016  # backticks are literal Markdown code spans
              UPDATES=$(git log --format='%h %s' "${LATEST_TAG}..HEAD" \
                | grep -E '^[0-9a-f]+ image(\([^)]*\))?!?:' \
                | sed -E 's/^([0-9a-f]+) /- `\1` /' || true)
              if [ -n "$UPDATES" ]; then
                echo "$UPDATES"
              else
                echo "_No image updates since ${LATEST_TAG}._"
              fi
            else
              echo "_No previous release tag found._"
            fi
            echo ""
            echo "### Images to be pushed"
            echo ""
            if [ "$BASE_VARIANTS" != "[]" ]; then
              echo "**Debian base:**"
              echo "$BASE_VARIANTS" | jq -r '.[]' | while read -r variant; do
                echo "- \`${BASE_IMAGE_REF}:${variant}-${BUILD_DATE}\`"
              done
              echo ""
            fi
            if [ "$MATRIX" != "[]" ]; then
              echo "**Other images:**"
              echo "$MATRIX" | jq -r \
                '.[] | "- `ghcr.io/" + env.REPO_OWNER + "/" + .image + ":" + .primary_tag + "-" + env.BUILD_DATE + "`"'
              echo ""
            fi
            if [ "$SKIPPED" != "[]" ]; then
              echo "### Images left at their previous build"
              echo ""
              echo "$SKIPPED" | jq -r '.[] | "- `ghcr.io/" + env.REPO_OWNER + "/" + . + "`"'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  gate:
    permissions: {}
    needs: [setup]
    # Skipping the build jobs on PRs from forks.
    if: >-
      needs.setup.outputs.should_run == 'true' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    environment: ${{ github.event_name != 'pull_request' && 'release' || 'ci' }}
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Gate
        run: echo "Release gate passed"

  build-base:
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
      packages: write
    needs: [setup, gate]
    if: needs.setup.outputs.should_run == 'true' && needs.setup.outputs.base_variants != '[]'
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJson(needs.setup.outputs.base_variants) }}
    uses: ./.github/workflows/publish-image.yml
    with:
      image: debian
      variant: ${{ matrix.variant }}
      image_ref: ghcr.io/${{ github.repository_owner }}/debian
      build_date: ${{ needs.setup.outputs.build_date }}
      overwrite: ${{ inputs.overwrite || false }}
      dryrun: ${{ github.event_name == 'pull_request' }}

  build-image:
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
      packages: write
    needs: [setup, gate, build-base]
    # !cancelled() lets this run when build-base was skipped, so every other
    # needed result is checked explicitly.
    if: >-
      ${{ !cancelled() &&
      needs.setup.outputs.should_run == 'true' &&
      needs.gate.result == 'success' &&
      (needs.build-base.result == 'success' || needs.build-base.result == 'skipped') &&
      needs.setup.outputs.matrix != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.setup.outputs.matrix) }}
    uses: ./.github/workflows/publish-image.yml
    with:
      image: ${{ matrix.image }}
      variant: ${{ matrix.variant }}
      image_ref: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
      build_date: ${{ needs.setup.outputs.build_date }}
      overwrite: ${{ inputs.overwrite || false }}
      dryrun: ${{ github.event_name == 'pull_request' }}

  # Not a dependency of create-tag: the images are published once they reach
  # GHCR, so a mirror failure must not hold back the release tag.
  mirror:
    permissions:
      contents: read
      packages: read
    needs: [setup, build-base, build-image]
    if: >-
      ${{ !cancelled() &&
      needs.setup.outputs.should_run == 'true' &&
      github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
      (needs.build-base.result == 'success' || needs.build-base.result == 'skipped') &&
      (needs.build-image.result == 'success' || needs.build-image.result == 'skipped') }}
    uses: ./.github/workflows/mirror.yml
    with:
      build_date: ${{ needs.setup.outputs.build_date }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_PAT: ${{ secrets.DOCKERHUB_PAT }}

  create-tag:
    permissions:
      actions: write
      contents: write
    needs: [setup, build-base, build-image]
    if: >-
      ${{ !cancelled() &&
      needs.setup.outputs.should_run == 'true' &&
      github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
      (needs.build-base.result == 'success' || needs.build-base.result == 'skipped') &&
      (needs.build-image.result == 'success' || needs.build-image.result == 'skipped') }}
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Create release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          BUILD_DATE: ${{ needs.setup.outputs.build_date }}
        run: |
          if gh api "repos/${REPO}/git/ref/tags/v${BUILD_DATE}" > /dev/null 2>&1; then
            echo "Tag v${BUILD_DATE} already exists, skipping."
          else
            gh api "repos/${REPO}/git/refs" \
              --method POST \
              -f ref="refs/tags/v${BUILD_DATE}" \
              -f sha="${SHA}"
            echo "Created release tag v${BUILD_DATE}."
            gh workflow run trivy.yml \
              --repo "${REPO}" \
              --ref main
          fi

  update-readme:
    permissions:
      contents: read
    needs: [setup, create-tag]
    if: needs.setup.outputs.should_run == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Regenerate README tag tables
        id: regen
        run: |
          ./scripts/update-readme.sh
          if git diff --quiet; then
            echo "READMEs are already in sync with build.yaml."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --name-only
          fi

      - name: Generate GitHub App Token
        id: app-token
        if: steps.regen.outputs.changed == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.HOUSEKEEPER_CLIENT_ID }}
          private-key: ${{ secrets.HOUSEKEEPER_PRIVATE_KEY }}

      - name: Open pull request
        if: steps.regen.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BUILD_DATE: ${{ needs.setup.outputs.build_date }}
        run: |
          set -e
          bash scripts/housekeeper-pr.sh \
            --branch "housekeeper/update-readme-tags-${BUILD_DATE}" \
            --title "docs: update README tag tables" \
            --body "Automated regeneration of image README tag tables from each image's \`build.yaml\` after release v${BUILD_DATE}."
