name: Attestation Checks

on:
  schedule:
    - cron: '0 8 * * 1'
  pull_request:
    paths:
      - .github/workflows/attest-check.yml
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash -euo pipefail {0}

env:
  BASE_IMAGE_REF: ghcr.io/${{ github.repository_owner }}/debian

jobs:
  setup:
    permissions:
      contents: read
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      base_variants: ${{ steps.build.outputs.base_variants }}
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      # Verify the build.yaml files from the latest release tag so that the
      # image tags always match published images, even if main has moved on.
      - name: Resolve latest release tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          LATEST_TAG=$(gh api "repos/${REPO}/git/refs/tags/v" \
            --paginate \
            --jq '.[] | select(.ref | test("refs/tags/v[0-9]{8}")) | .ref | ltrimstr("refs/tags/")' \
            2>/dev/null | sort | tail -1 || echo "")
          echo "Using ref: ${LATEST_TAG:-<default branch>}"
          echo "latest_tag=${LATEST_TAG}" >> "$GITHUB_OUTPUT"
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tag.outputs.latest_tag }}
          persist-credentials: false
      - name: Build image matrix
        id: build
        run: |
          echo "base_variants=$(bash scripts/build-config.sh variants debian | jq -c .)" >> "$GITHUB_OUTPUT"
          echo "matrix=$(bash scripts/build-config.sh all-matrix)" >> "$GITHUB_OUTPUT"

  verify-base:
    needs: setup
    permissions:
      contents: read
    runs-on: ubuntu-slim
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJson(needs.setup.outputs.base_variants) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify published image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_REF: ${{ env.BASE_IMAGE_REF }}:${{ matrix.variant }}
          OWNER: ${{ github.repository_owner }}
        run: bash scripts/verify-image.sh "$IMAGE_REF" "$OWNER"

  verify-image:
    needs: setup
    permissions:
      contents: read
    runs-on: ubuntu-slim
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.setup.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify published image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_REF: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ matrix.primary_tag }}
          OWNER: ${{ github.repository_owner }}
        run: bash scripts/verify-image.sh "$IMAGE_REF" "$OWNER"
