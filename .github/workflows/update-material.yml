name: Update Trusted Material

# Keeps trust material committed to this repository — signing keys,
# keyrings, and per-version checksum files — in sync with each upstream,
# as declared under `materials` in each image's build.yaml.
# update-material.sh refreshes one image's materials (a no-op if it has
# none) in the working tree and reports whether anything changed; this
# workflow loops over every image, then does the git side once for
# everything that changed: on schedule/dispatch it commits to a single
# housekeeper branch and opens one pull request, and on pull_request
# events it commits materials marked commit_to_pr directly to the PR's
# head branch, so a version bump and its matching checksums land in a
# single PR.

on:
  pull_request:
    paths:
      - .github/workflows/update-material.yml
      - scripts/update-material.sh
      - scripts/build-config.sh
      # Regenerates the materials an image derives itself when its script changes.
      - '*/checksum.sh'
      # Re-syncs commit_to_pr materials when Renovate bumps a pinned version.
      - '*/build.yaml'
  schedule:
    - cron: '0 6 * * 3'
  workflow_dispatch:

permissions: {}

jobs:
  update:
    permissions:
      contents: read
    runs-on: ubuntu-slim
    timeout-minutes: 10
    env:
      # PRs from forks don't have access to secrets.
      IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Update trusted material
        id: update
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eo pipefail
          images=$(bash scripts/build-config.sh images | jq -r '.[]')
          changed=false
          for image in $images; do
            args=("$image")
            if [ "$EVENT_NAME" = "pull_request" ]; then
              args+=(--commit-to-pr-only)
            fi
            result=$(bash scripts/update-material.sh "${args[@]}")
            if [ "$result" = "true" ]; then
              changed=true
            fi
          done
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Generate GitHub App Token
        id: app-token
        if: steps.update.outputs.changed == 'true' && env.IS_FORK_PR != 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.HOUSEKEEPER_CLIENT_ID }}
          private-key: ${{ secrets.HOUSEKEEPER_PRIVATE_KEY }}

      - name: Commit refreshed files
        if: steps.update.outputs.changed == 'true' && env.IS_FORK_PR != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -eo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # The files belong to the version bump that is already under
            # review, so they go onto its own branch and open nothing.
            bash scripts/housekeeper-pr.sh --no-pr \
              --branch "${HEAD_REF}" \
              --title "chore: update trusted material"
          else
            files=$(git diff --name-only | sed 's/^/- `/;s/$/`/')
            bash scripts/housekeeper-pr.sh \
              --branch housekeeper/update-material \
              --title "chore: update trusted material" \
              --body "Automated sync of trusted material."$'\n\n'"${files}"
          fi
