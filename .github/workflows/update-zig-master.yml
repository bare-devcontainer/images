name: Update Zig Master Build

# Refreshes the Zig master build pinned in zig/build.yaml, which Renovate
# cannot track: master builds carry no tag, and the matching ZLS build is
# served by an API rather than published as a release. update-zig-master.sh
# resolves both and this workflow proposes the result as a pull request, so
# build-checks.yml builds the resolved master before it can reach the
# registry: a broken master fails the check and stays unmerged, leaving the
# published master tag on the last build that worked.

on:
  # Thursday, so the bump does not land on the Monday the weekly rebuild,
  # the Trivy scan and the attestation checks already share.
  schedule:
    - cron: '0 6 * * 4'
  workflow_dispatch:

permissions: {}

jobs:
  update:
    permissions:
      contents: read
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve the published master build
        id: update
        run: |
          set -eo pipefail
          # Assigned first so a failed resolution fails the step; inside the
          # echo below, the script's exit status would be discarded.
          CHANGED=$(bash scripts/update-zig-master.sh)
          ZIG_VERSION=$(yq '.variants[] | select(.variant == "master-trixie") | .build_args.ZIG_VERSION' zig/build.yaml)
          ZLS_VERSION=$(yq '.variants[] | select(.variant == "master-trixie") | .build_args.ZLS_VERSION' zig/build.yaml)
          {
            echo "changed=${CHANGED}"
            echo "zig_version=${ZIG_VERSION}"
            echo "zls_version=${ZLS_VERSION}"
          } >> "$GITHUB_OUTPUT"

      - name: Generate GitHub App Token
        id: app-token
        if: steps.update.outputs.changed == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.HOUSEKEEPER_CLIENT_ID }}
          private-key: ${{ secrets.HOUSEKEEPER_PRIVATE_KEY }}

      - name: Open pull request
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ZIG_VERSION: ${{ steps.update.outputs.zig_version }}
          ZLS_VERSION: ${{ steps.update.outputs.zls_version }}
        run: |
          set -eo pipefail
          # The versions go in the body rather than the title: the branch is
          # reused, so an open pull request picks up a newer build as another
          # commit and a title naming one version would go stale.
          BODY=$(cat <<EOF
          The Zig master build currently published on ziglang.org, with the ZLS build the
          [release worker](https://github.com/zigtools/release-worker) reports as compatible with it.

          | | Version |
          |---|---|
          | Zig | \`${ZIG_VERSION}\` |
          | ZLS | \`${ZLS_VERSION}\` |

          Both are verified at build time against the minisign keys committed to this
          repository, exactly as the release variants are. Merge only once the build checks
          pass: a master that fails them leaves \`zig:master\` on the last build that worked.
          EOF
          )
          bash scripts/housekeeper-pr.sh \
            --branch housekeeper/update-zig-master \
            --title "image(zig): update zig master build" \
            --body "${BODY}"
