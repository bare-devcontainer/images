name: Update Zig Master Build

on:
  # Resolving the build is the half worth exercising before a change to it
  # reaches a scheduled run; the steps that write anything are skipped below.
  pull_request:
    paths:
      - .github/workflows/update-zig-master.yml
      - scripts/update-zig-master.sh
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  update:
    permissions:
      contents: read
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve the published master build
        id: update
        run: |
          set -eo pipefail
          # Assigned, so a failed resolution fails the step rather than being
          # discarded inside the echo below.
          CHANGED=$(bash scripts/update-zig-master.sh)
          ZIG_VERSION=$(yq '.variants[] | select(.variant == "master-trixie") | .build_args.ZIG_VERSION' zig/build.yaml)
          ZLS_VERSION=$(yq '.variants[] | select(.variant == "master-trixie") | .build_args.ZLS_VERSION' zig/build.yaml)
          {
            echo "changed=${CHANGED}"
            echo "zig_version=${ZIG_VERSION}"
            echo "zls_version=${ZLS_VERSION}"
          } >> "$GITHUB_OUTPUT"

      - name: Generate GitHub App Token
        id: app-token
        if: steps.update.outputs.changed == 'true' && github.event_name != 'pull_request'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.HOUSEKEEPER_CLIENT_ID }}
          private-key: ${{ secrets.HOUSEKEEPER_PRIVATE_KEY }}

      - name: Open pull request
        if: steps.update.outputs.changed == 'true' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ZIG_VERSION: ${{ steps.update.outputs.zig_version }}
          ZLS_VERSION: ${{ steps.update.outputs.zls_version }}
        run: |
          set -eo pipefail
          # The versions go in the body, which the script rewrites on every
          # run; a title naming one of them would go stale on the next bump.
          BODY=$(cat <<EOF
          The Zig master build currently published on ziglang.org, with the ZLS build the
          [release worker](https://github.com/zigtools/release-worker) reports as compatible with it.

          | | Version |
          |---|---|
          | Zig | \`${ZIG_VERSION}\` |
          | ZLS | \`${ZLS_VERSION}\` |

          Both are verified at build time against the minisign keys committed to this
          repository, exactly as the release variants are. Merge only once the build checks
          pass: a master that fails them leaves \`zig:master\` on the last build that worked.
          EOF
          )
          bash scripts/housekeeper-pr.sh \
            --branch housekeeper/update-zig-master \
            --title "image(zig): update zig master build" \
            --body "${BODY}"
