name: Build Checks

on:
  pull_request:
    paths:
      - .github/workflows/build-checks.yml
      - bun/**
      - debian/**
      - deno/**
      - golang/**
      - mise/**
      - node/**
      - opentofu/**
      - pnpm/**
      - rustup/**
      - temurin/**
      - terraform/**
      - uv/**
      - zig/**
      - '!*/README.md'
      - .devcontainer/feature-**
      - .devcontainer/sandbox-**
      - scripts/build-config.sh
      - scripts/changed-images.sh
      - .trivyignore.yaml
  push:
    branches:
      - main
    paths:
      - bun/**
      - debian/**
      - deno/**
      - golang/**
      - mise/**
      - node/**
      - opentofu/**
      - pnpm/**
      - rustup/**
      - temurin/**
      - terraform/**
      - uv/**
      - zig/**
      - '!*/README.md'
      - .devcontainer/feature-**
      - .devcontainer/sandbox-**
      - scripts/build-config.sh
      - scripts/changed-images.sh

permissions: {}

defaults:
  run:
    shell: bash -euo pipefail {0}

env:
  # renovate: datasource=github-releases depName=aquasecurity/trivy
  TRIVY_VERSION: "v0.74.0"
  TRIVY_SEVERITY: CRITICAL,HIGH

jobs:
  setup:
    permissions:
      contents: read
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      base_matrix: ${{ steps.build.outputs.base_matrix }}
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the diff against the base commit can be resolved.
          fetch-depth: 0
          persist-credentials: false
      - name: Detect changed images
        id: changed
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          CHANGED_FILES: ${{ runner.temp }}/changed-files.txt
        run: |
          # Diffing from the merge base keeps commits that only landed on the
          # base branch out of the change set, on both pull_request and push.
          # Whenever that base commit cannot be resolved (first push to a
          # branch, force push, deleted commit), fall back to treating every
          # tracked file as changed so no image is skipped by accident.
          if [ -n "$BASE_SHA" ] && git cat-file -e "${BASE_SHA}^{commit}" 2> /dev/null; then
            echo "=== Changed files (${BASE_SHA}...${HEAD_SHA}) ==="
            git diff --name-only "${BASE_SHA}...${HEAD_SHA}" | tee "$CHANGED_FILES"
          else
            echo "=== Changed files ==="
            echo "Base commit ${BASE_SHA:-<unknown>} is unavailable; treating every tracked file as changed."
            git ls-files > "$CHANGED_FILES"
          fi

          REPORT=$(bash scripts/changed-images.sh build "$CHANGED_FILES")
          echo "report=${REPORT}" >> "$GITHUB_OUTPUT"

          # Report every image, selected or not, together with the changes it
          # was selected for, so a skipped image can be verified from the log.
          echo "=== Test targets ==="
          echo "$REPORT" | jq -r '.[] |
            "[" + (if .selected then "RUN " else "SKIP" end) + "] " + .image + ": " + .reason,
            (.files[] | "         " + .)'
      - name: Verify sandbox configurations
        # The build jobs export the build args of the variant they build so the
        # sandbox configuration picks them up through ${localEnv:...}. That only
        # holds while every image has a sandbox and every sandbox declares
        # exactly the args of its image; otherwise an argument silently resolves
        # to the empty string. Neither is tied to a changed image, so both are
        # checked for the whole repository here.
        run: |
          IMAGES=$(bash scripts/build-config.sh images | jq -r '.[]')
          SANDBOXES=$(find .devcontainer -maxdepth 1 -type d -name 'sandbox-*' -printf '%f\n' \
            | sed 's/^sandbox-//' | sort)
          if [ "$(echo "$IMAGES" | sort)" != "$SANDBOXES" ]; then
            echo "ERROR: sandbox dev containers do not match the image list" >&2
            diff <(echo "$IMAGES" | sort) <(echo "$SANDBOXES") >&2 || true
            exit 1
          fi

          STATUS=0
          for IMAGE in $IMAGES; do
            CONFIG=".devcontainer/sandbox-${IMAGE}/devcontainer.json"
            DECLARED=$({ grep -o '\${localEnv:[A-Z_]\+}' "$CONFIG" || true; } \
              | sed 's/^\${localEnv:\(.*\)}$/\1/' | sort -u)
            for VARIANT in $(bash scripts/build-config.sh variants "$IMAGE" | jq -r '.[]'); do
              # DEBIAN_TAG is a build arg of the debian image and the base
              # selector of every other one, so only the latter add it here.
              EXPECTED=$({
                bash scripts/build-config.sh build-args "$IMAGE" "$VARIANT" | cut -d= -f1
                [ "$IMAGE" = "debian" ] || echo "DEBIAN_TAG"
              } | sort -u)
              if [ "$DECLARED" != "$EXPECTED" ]; then
                echo "ERROR: ${CONFIG} does not declare the build args of ${IMAGE}/${VARIANT}" >&2
                diff <(echo "$EXPECTED") <(echo "$DECLARED") >&2 || true
                STATUS=1
              fi
            done
          done
          exit "$STATUS"
      - name: Build matrix
        id: build
        # Expand each entry across both architectures so images are
        # smoke-tested on the same platforms they are published for.
        env:
          REPORT: ${{ steps.changed.outputs.report }}
        run: |
          SELECTED=$(echo "$REPORT" | jq -c '[.[] | select(.selected) | .image]')

          BASE_MATRIX='[]'
          if echo "$SELECTED" | jq -e 'any(. == "debian")' > /dev/null; then
            BASE_MATRIX=$(bash scripts/build-config.sh variants debian \
              | jq -c '[.[] as $v | ("amd64", "arm64") | {variant: $v, arch: .}]')
          fi
          MATRIX=$(bash scripts/build-config.sh all-matrix \
            | jq -c --argjson selected "$SELECTED" \
              '[.[] | select(.image | IN($selected[])) as $m | ("amd64", "arm64") | $m + {arch: .}]')

          echo "base_matrix=${BASE_MATRIX}" >> "$GITHUB_OUTPUT"
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"

  check-base:
    needs: setup
    if: needs.setup.outputs.base_matrix != '[]'
    permissions:
      contents: read
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.setup.outputs.base_matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read build args
        id: read
        run: |
          DELIM="EOF_$(openssl rand -hex 8)"
          {
            echo "build_args<<${DELIM}"
            bash scripts/build-config.sh build-args debian "${{ matrix.variant }}"
            echo "${DELIM}"
          } >> "$GITHUB_OUTPUT"
          bash scripts/build-config.sh build-args debian "${{ matrix.variant }}" \
            | sed -n 's/^DEBIAN_TAG=/debian_tag=/p' >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build debian image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./debian
          outputs: |
            type=docker,name=debian:${{ matrix.variant }}
            type=oci,dest=${{ runner.temp }}/base,tar=false
          build-args: ${{ steps.read.outputs.build_args }}
          # Cache scopes are arch-suffixed to match publish-image.yml so PR
          # builds and release dry-runs share the same cache entries.
          cache-from: type=gha,scope=debian-${{ matrix.variant }}-${{ matrix.arch }}
          cache-to: ${{ github.ref == 'refs/heads/main' && format('type=gha,scope=debian-{0}-{1},mode=max', matrix.variant, matrix.arch) || '' }}
      - name: Upload debian image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: base-${{ matrix.variant }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/base
          if-no-files-found: error
          retention-days: 1
      - name: Verify devcontainer.metadata label
        run: |
          docker inspect --format '{{ index .Config.Labels "devcontainer.metadata" }}' \
            "debian:${{ matrix.variant }}" \
            | jq -e 'map(select(.remoteUser == "dev")) | length > 0'
      - name: Run smoke test
        run: |
          docker run --rm \
            --mount "type=bind,source=${{ github.workspace }}/debian/smoke-test.sh,target=/smoke-test.sh,readonly" \
            "debian:${{ matrix.variant }}" \
            bash /smoke-test.sh
      - name: Verify sandbox dev container
        # Built with the same args as the build step above, so the Dev Container
        # CLI reuses those layers rather than rebuilding the image. The image
        # contents are already covered by the smoke test, so this asserts only
        # what the configuration adds: the CLI resolves it and applies remoteUser.
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        env:
          DEBIAN_TAG: ${{ steps.read.outputs.debian_tag }}
        with:
          configFile: .devcontainer/sandbox-debian/devcontainer.json
          push: never
          runCmd: |
            set -euo pipefail
            [ "$(id -un)" = "dev" ] \
              || { echo "ERROR: expected user dev, got $(id -un)" >&2; exit 1; }
      - name: Run Trivy vulnerability scanner
        # Vulnerability findings are identical across architectures; scan once.
        if: matrix.arch == 'amd64'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: debian:${{ matrix.variant }}
          format: table
          severity: ${{ env.TRIVY_SEVERITY }}
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          exit-code: '1'
      - name: Run Dev Container feature tests
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        env:
          # Read by the configuration through ${localEnv:DEBIAN_TAG}, so the
          # Features are layered onto the variant this job builds.
          DEBIAN_TAG: ${{ steps.read.outputs.debian_tag }}
        with:
          configFile: .devcontainer/feature-debian/devcontainer.json
          push: never
          runCmd: |
            set -euo pipefail
            bash debian/smoke-test.sh
            bash .devcontainer/feature-debian/test.sh

  check-image:
    needs: [setup, check-base]
    # !cancelled() lets this run when check-base was skipped, so every other
    # needed result is checked explicitly.
    if: >-
      ${{ !cancelled() &&
      needs.setup.result == 'success' &&
      needs.setup.outputs.matrix != '[]' &&
      (needs.check-base.result == 'success' || needs.check-base.result == 'skipped') }}
    permissions:
      contents: read
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.setup.outputs.matrix) }}
    services:
      # Holds the debian image check-base built, for the builder below to
      # resolve the ghcr.io base of the language image to.
      registry:
        image: registry:3.1.1@sha256:1be55279f18a2fe1a74edf2664cac61c1bea305b7b4642dab412e7affdcb3e33
        ports:
          - 5000:5000
    env:
      # Both name the repository the language Dockerfiles take their base
      # FROM, since a mirror keeps the path after the host.
      BASE_IMAGE_REF: ghcr.io/bare-devcontainer/debian
      MIRROR_IMAGE_REF: localhost:5000/bare-devcontainer/debian
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read build args
        id: read
        run: |
          DEBIAN_VARIANT=$(bash scripts/build-config.sh get-field "${{ matrix.image }}" \
            "${{ matrix.variant }}" debian_variant)
          DELIM="EOF_$(openssl rand -hex 8)"
          {
            echo "debian_variant=${DEBIAN_VARIANT}"
            echo "image_args<<${DELIM}"
            bash scripts/build-config.sh build-args "${{ matrix.image }}" "${{ matrix.variant }}"
            echo "${DELIM}"
          } >> "$GITHUB_OUTPUT"
          # The sandbox configuration reads the same values through
          # ${localEnv:...}. Exported rather than set per step because the keys
          # differ per image. DEBIAN_TAG is the tag where the language image
          # takes the digest, since the daemon holds the base under the tag.
          {
            bash scripts/build-config.sh build-args "${{ matrix.image }}" "${{ matrix.variant }}"
            echo "DEBIAN_TAG=${DEBIAN_VARIANT}"
          } >> "$GITHUB_ENV"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          # The builder shares the host network to reach the registry service,
          # and BuildKit tries a registry's mirrors before the registry itself,
          # so every build on this builder, the sandbox dev container's
          # included, takes the ghcr.io debian base from the registry service
          # once the step below has put the image check-base built there, and
          # from ghcr.io otherwise.
          driver-opts: network=host
          buildkitd-config-inline: |
            [registry."ghcr.io"]
              mirrors = ["localhost:5000"]
      - name: Download debian image
        if: needs.check-base.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: base-${{ steps.read.outputs.debian_variant }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/base
      - name: Resolve base image
        id: base
        # A digest from check-base exists only in the registry service, so the
        # FROM can resolve to no other image.
        env:
          BASE_BUILT: ${{ needs.check-base.result == 'success' }}
          DEBIAN_VARIANT: ${{ steps.read.outputs.debian_variant }}
          OCI_LAYOUT: ${{ runner.temp }}/base
        run: |
          if [ "$BASE_BUILT" = "true" ]; then
            REF="${MIRROR_IMAGE_REF}:${DEBIAN_VARIANT}"
            # The layout holds the image under the name check-base built it
            # with, which no tag of this repository matches, so it is addressed
            # by the digest index.json records for it.
            LAYOUT_DIGEST=$(jq -r '.manifests[0].digest' "${OCI_LAYOUT}/index.json")
            if [ -z "$LAYOUT_DIGEST" ] || [ "$LAYOUT_DIGEST" = "null" ]; then
              echo "No manifest in ${OCI_LAYOUT}/index.json" >&2
              exit 1
            fi
            docker buildx imagetools create -t "$REF" "oci-layout://${OCI_LAYOUT}@${LAYOUT_DIGEST}"
            # The Dev Container CLI reads the base through the Docker daemon,
            # which knows no mirror, so this image has to reach the daemon
            # under the name the Dockerfiles take their base FROM.
            docker pull "$REF"
            docker tag "$REF" "${BASE_IMAGE_REF}:${DEBIAN_VARIANT}"
          else
            REF="${BASE_IMAGE_REF}:${DEBIAN_VARIANT}"
          fi
          DIGEST=$(docker buildx imagetools inspect "$REF" --format '{{json .Manifest}}' | jq -r '.digest')
          if [ -z "$DIGEST" ] || [ "$DIGEST" = "null" ]; then
            echo "Failed to get digest for ${REF}" >&2
            exit 1
          fi
          echo "=== Base image ==="
          echo "${REF}@${DIGEST}"
          echo "debian_tag=${DEBIAN_VARIANT}@${DIGEST}" >> "$GITHUB_OUTPUT"
      - name: Build language image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./${{ matrix.image }}
          push: false
          load: true
          tags: ${{ matrix.image }}:${{ matrix.variant }}
          build-args: |
            ${{ steps.read.outputs.image_args }}
            DEBIAN_TAG=${{ steps.base.outputs.debian_tag }}
          # The scope is the one publish-image.yml reads and writes for this
          # image, variant and architecture. That build takes the published
          # base, so a run whose base came from check-base writes nothing to it.
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.variant }}-${{ matrix.arch }}
          cache-to: ${{ github.ref == 'refs/heads/main' && needs.check-base.result != 'success'
            && format('type=gha,scope={0}-{1}-{2},mode=max', matrix.image, matrix.variant, matrix.arch) || '' }}
      - name: Verify devcontainer.metadata label
        # Guards against a child image accidentally dropping the label
        # inherited from the debian base image.
        run: |
          docker inspect --format '{{ index .Config.Labels "devcontainer.metadata" }}' \
            "${{ matrix.image }}:${{ matrix.variant }}" \
            | jq -e 'map(select(.remoteUser == "dev")) | length > 0'
      - name: Run smoke test
        env:
          MISE_GITHUB_TOKEN: ${{ matrix.image == 'mise' && github.token || '' }}
        run: |
          docker run --rm \
            ${{ matrix.image == 'mise' && '--env MISE_GITHUB_TOKEN' || '' }} \
            --mount "type=bind,source=${{ github.workspace }}/debian/smoke-test.sh,target=/smoke-test-debian.sh,readonly" \
            --mount "type=bind,source=${{ github.workspace }}/${{ matrix.image }}/smoke-test.sh,target=/smoke-test.sh,readonly" \
            "${{ matrix.image }}:${{ matrix.variant }}" \
            bash -c "bash /smoke-test-debian.sh && bash /smoke-test.sh"
      - name: Verify sandbox dev container
        # Built with the same args as the build step above, so the Dev Container
        # CLI reuses those layers rather than rebuilding the image. The image
        # contents are already covered by the smoke test, so this asserts only
        # what the configuration adds: the CLI resolves it and applies remoteUser.
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          configFile: .devcontainer/sandbox-${{ matrix.image }}/devcontainer.json
          push: never
          runCmd: |
            set -euo pipefail
            [ "$(id -un)" = "dev" ] \
              || { echo "ERROR: expected user dev, got $(id -un)" >&2; exit 1; }
      - name: Run Trivy vulnerability scanner
        # Vulnerability findings are identical across architectures; scan once.
        if: matrix.arch == 'amd64'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: ${{ matrix.image }}:${{ matrix.variant }}
          format: table
          severity: ${{ env.TRIVY_SEVERITY }}
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          exit-code: '1'
