name: Build Checks

on:
  pull_request:
    paths:
      - .github/workflows/build-checks.yml
      - '*/Dockerfile'
      - '*/build.yaml'
      - '*/smoke-test.sh'
      - '*/node-keyring.kbx'
      - '*/rustup-init-*.sha256'
      - '*/uv-*.sha256'
      - scripts/build-config.sh
      - scripts/changed-images.sh
      - .trivyignore.yaml
  push:
    branches:
      - main
    paths:
      - '*/Dockerfile'
      - '*/build.yaml'
      - '*/smoke-test.sh'
      - '*/node-keyring.kbx'
      - '*/rustup-init-*.sha256'
      - '*/uv-*.sha256'
      - scripts/build-config.sh
      - scripts/changed-images.sh

permissions: {}

env:
  # renovate: datasource=github-releases depName=aquasecurity/trivy
  TRIVY_VERSION: "v0.72.0"
  TRIVY_SEVERITY: CRITICAL,HIGH

jobs:
  setup:
    permissions:
      contents: read
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      base_matrix: ${{ steps.build.outputs.base_matrix }}
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Full history so the diff against the base commit can be resolved.
          fetch-depth: 0
          persist-credentials: false
      - name: Detect changed images
        id: changed
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          CHANGED_FILES: ${{ runner.temp }}/changed-files.txt
        run: |
          # Diffing from the merge base keeps commits that only landed on the
          # base branch out of the change set, on both pull_request and push.
          # Whenever that base commit cannot be resolved (first push to a
          # branch, force push, deleted commit), fall back to treating every
          # tracked file as changed so no image is skipped by accident.
          if [ -n "$BASE_SHA" ] && git cat-file -e "${BASE_SHA}^{commit}" 2> /dev/null; then
            echo "=== Changed files (${BASE_SHA}...${HEAD_SHA}) ==="
            git diff --name-only "${BASE_SHA}...${HEAD_SHA}" | tee "$CHANGED_FILES"
          else
            echo "=== Changed files ==="
            echo "Base commit ${BASE_SHA:-<unknown>} is unavailable; treating every tracked file as changed."
            git ls-files > "$CHANGED_FILES"
          fi

          REPORT=$(bash scripts/changed-images.sh "$CHANGED_FILES")
          echo "report=${REPORT}" >> "$GITHUB_OUTPUT"

          # Report every image, selected or not, together with the changes it
          # was selected for, so a skipped image can be verified from the log.
          echo "=== Test targets ==="
          echo "$REPORT" | jq -r '.[] |
            "[" + (if .selected then "RUN " else "SKIP" end) + "] " + .image + ": " + .reason,
            (.files[] | "         " + .)'
      - name: Build matrix
        id: build
        # Expand each entry across both architectures so images are
        # smoke-tested on the same platforms they are published for.
        env:
          REPORT: ${{ steps.changed.outputs.report }}
        run: |
          SELECTED=$(echo "$REPORT" | jq -c '[.[] | select(.selected) | .image]')

          BASE_MATRIX='[]'
          if echo "$SELECTED" | jq -e 'any(. == "debian")' > /dev/null; then
            BASE_MATRIX=$(bash scripts/build-config.sh variants debian \
              | jq -c '[.[] as $v | ("amd64", "arm64") | {variant: $v, arch: .}]')
          fi
          MATRIX=$(bash scripts/build-config.sh all-matrix \
            | jq -c --argjson selected "$SELECTED" \
              '[.[] | select(.image | IN($selected[])) as $m | ("amd64", "arm64") | $m + {arch: .}]')

          echo "base_matrix=${BASE_MATRIX}" >> "$GITHUB_OUTPUT"
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"

  check-base:
    needs: setup
    if: needs.setup.outputs.base_matrix != '[]'
    permissions:
      contents: read
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.setup.outputs.base_matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Read build args
        id: read
        run: |
          DELIM="EOF_$(openssl rand -hex 8)"
          {
            echo "build_args<<${DELIM}"
            bash scripts/build-config.sh build-args debian "${{ matrix.variant }}"
            echo "${DELIM}"
          } >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build debian image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./debian
          push: false
          load: true
          tags: debian:${{ matrix.variant }}
          build-args: ${{ steps.read.outputs.build_args }}
          # Cache scopes are arch-suffixed to match publish-image.yml so PR
          # builds and release dry-runs share the same cache entries.
          cache-from: type=gha,scope=debian-${{ matrix.variant }}-${{ matrix.arch }}
          cache-to: ${{ github.ref == 'refs/heads/main' && format('type=gha,scope=debian-{0}-{1},mode=max', matrix.variant, matrix.arch) || '' }}
      - name: Verify devcontainer.metadata label
        run: |
          docker inspect --format '{{ index .Config.Labels "devcontainer.metadata" }}' \
            "debian:${{ matrix.variant }}" \
            | jq -e 'map(select(.remoteUser == "dev")) | length > 0'
      - name: Run smoke test
        run: |
          docker run --rm \
            --mount "type=bind,source=${{ github.workspace }}/debian/smoke-test.sh,target=/smoke-test.sh,readonly" \
            "debian:${{ matrix.variant }}" \
            bash /smoke-test.sh
      - name: Run Trivy vulnerability scanner
        # Vulnerability findings are identical across architectures; scan once.
        if: matrix.arch == 'amd64'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: debian:${{ matrix.variant }}
          format: table
          severity: ${{ env.TRIVY_SEVERITY }}
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          exit-code: '1'

  check-image:
    needs: setup
    if: needs.setup.outputs.matrix != '[]'
    permissions:
      contents: read
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.setup.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Read build args
        id: read
        run: |
          DEBIAN_VARIANT=$(bash scripts/build-config.sh get-field "${{ matrix.image }}" \
            "${{ matrix.variant }}" debian_variant)
          DELIM="EOF_$(openssl rand -hex 8)"
          {
            echo "image_args<<${DELIM}"
            bash scripts/build-config.sh build-args "${{ matrix.image }}" "${{ matrix.variant }}"
            echo "DEBIAN_TAG=${DEBIAN_VARIANT}"
            echo "${DELIM}"
          } >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build language image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./${{ matrix.image }}
          push: false
          load: true
          tags: ${{ matrix.image }}:${{ matrix.variant }}
          build-args: ${{ steps.read.outputs.image_args }}
          # Cache scopes are arch-suffixed to match publish-image.yml so PR
          # builds and release dry-runs share the same cache entries.
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.variant }}-${{ matrix.arch }}
          cache-to: ${{ github.ref == 'refs/heads/main' && format('type=gha,scope={0}-{1}-{2},mode=max', matrix.image, matrix.variant, matrix.arch) || '' }}
      - name: Verify devcontainer.metadata label
        # Guards against a child image accidentally dropping the label
        # inherited from the debian base image.
        run: |
          docker inspect --format '{{ index .Config.Labels "devcontainer.metadata" }}' \
            "${{ matrix.image }}:${{ matrix.variant }}" \
            | jq -e 'map(select(.remoteUser == "dev")) | length > 0'
      - name: Run smoke test
        env:
          MISE_GITHUB_TOKEN: ${{ matrix.image == 'mise' && github.token || '' }}
        run: |
          docker run --rm \
            ${{ matrix.image == 'mise' && '--env MISE_GITHUB_TOKEN' || '' }} \
            --mount "type=bind,source=${{ github.workspace }}/debian/smoke-test.sh,target=/smoke-test-debian.sh,readonly" \
            --mount "type=bind,source=${{ github.workspace }}/${{ matrix.image }}/smoke-test.sh,target=/smoke-test.sh,readonly" \
            "${{ matrix.image }}:${{ matrix.variant }}" \
            bash -c "bash /smoke-test-debian.sh && bash /smoke-test.sh"
      - name: Run Trivy vulnerability scanner
        # Vulnerability findings are identical across architectures; scan once.
        if: matrix.arch == 'amd64'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: ${{ matrix.image }}:${{ matrix.variant }}
          format: table
          severity: ${{ env.TRIVY_SEVERITY }}
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          exit-code: '1'
