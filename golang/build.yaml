description: "Dev Container image with the Go toolchain, built on Debian"
materials:
  - path: google-linux-signing-key.asc
    url: https://dl.google.com/linux/linux_signing_key.pub
    description: >-
      Google's Linux Packages signing key from dl.google.com, used to verify
      the Go toolchain.
variants:
  - variant: "1.27-trixie"
    tags:
      # renovate: datasource=golang-version depName=golang versioning=semver
      - "1.27.1-trixie"
      - "1.27-trixie"
      - "1-trixie"
      - "trixie"
      # renovate: datasource=golang-version depName=golang versioning=semver
      - "1.27.1"
      - "1.27"
      - "1"
    debian_variant: "trixie"
    build_args:
      # renovate: datasource=golang-version depName=golang
      GOLANG_VERSION: "1.27.1"
      # renovate: datasource=go depName=golang.org/x/tools/gopls
      GOPLS_VERSION: "v0.23.0"

  - variant: "1.27-bookworm"
